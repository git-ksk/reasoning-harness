[package]
name = "reasoning-harness-cli"
description = "Native CLI for the reasoning harness."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
default-run = "reason"

[[bin]]
name = "reason"
path = "src/main.rs"

[[bin]]
name = "reason-format-study"
path = "src/bin/format_invariance.rs"

[[bin]]
name = "reason-materialization-study"
path = "src/bin/materialization.rs"

[dependencies]
clap.workspace = true
reasoning-harness-core = { path = "../reasoning-harness-core" }
reasoning-harness-providers = { path = "../reasoning-harness-providers" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
