[package]
name = "reasoning-harness-cli"
description = "Native CLI for the reasoning harness."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
default-run = "reason"

[[bin]]
name = "reason"
path = "src/main.rs"

[[bin]]
name = "reason-format-study"
path = "src/bin/format_invariance.rs"

[[bin]]
name = "reason-materialization-study"
path = "src/bin/materialization.rs"

[[bin]]
name = "reason-stability-study"
path = "src/bin/stability.rs"

[[bin]]
name = "reason-cross-model-study"
path = "src/bin/cross_model.rs"

[[bin]]
name = "reason-decidability-study"
path = "src/bin/decidability.rs"

[[bin]]
name = "reason-semantic-preflight"
path = "src/bin/semantic_preflight.rs"

[dependencies]
clap.workspace = true
reasoning-harness-core = { path = "../reasoning-harness-core" }
reasoning-harness-providers = { path = "../reasoning-harness-providers" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
