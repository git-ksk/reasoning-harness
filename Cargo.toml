[workspace]
resolver = "2"
members = [
  "crates/reasoning-harness-core",
  "crates/reasoning-harness-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/git-ksk/reasoning-harness"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
