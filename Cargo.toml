[workspace]
resolver = "2"
members = [
  "crates/reasoning-harness-core",
  "crates/reasoning-harness-cli",
  "crates/reasoning-harness-providers",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/git-ksk/reasoning-harness"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
ctrlc = "3"
thiserror = "2"
httpdate = "1"
sha2 = "0.11"
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
rpassword = "7.5.4"
semver = { version = "1", features = ["serde"] }
fs2 = "0.4"
libc = "0.2"
