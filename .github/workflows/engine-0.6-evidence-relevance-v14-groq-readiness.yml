name: engine-0.6-evidence-relevance-v14-groq-readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  groq-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODEL: openai/gpt-oss-120b
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - name: Verify readiness inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GROQ_API_KEY"
          echo "Synthetic transport readiness only; no calibration fixture is read or submitted."

      - name: Probe Groq transport and quota state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/groq-readiness
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = {
              "model": "openai/gpt-oss-120b",
              "messages": [
                  {
                      "role": "system",
                      "content": "This is a synthetic transport readiness probe. Return only a tiny JSON object.",
                  },
                  {
                      "role": "user",
                      "content": 'Return exactly {"ready":true}.',
                  },
              ],
              "max_completion_tokens": 64,
              "reasoning_effort": "low",
              "include_reasoning": False,
              "temperature": 0.0,
              "stream": False,
          }
          Path("/tmp/groq-readiness/request.json").write_text(json.dumps(payload))
          PY

          success=0
          for probe in 1 2 3; do
            headers="/tmp/groq-readiness/headers-${probe}.txt"
            body="/tmp/groq-readiness/body-${probe}.json"
            status="$(curl --silent --show-error \
              --max-time 90 \
              --dump-header "$headers" \
              --output "$body" \
              --write-out '%{http_code}' \
              -H "Authorization: Bearer $GROQ_API_KEY" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/groq-readiness/request.json \
              https://api.groq.com/openai/v1/chat/completions)"

            PROBE="$probe" STATUS="$status" HEADERS="$headers" BODY="$body" python3 - <<'PY'
          import json, os
          from pathlib import Path

          probe = int(os.environ["PROBE"])
          status = int(os.environ["STATUS"])
          headers_text = Path(os.environ["HEADERS"]).read_text(errors="replace")
          body_text = Path(os.environ["BODY"]).read_text(errors="replace")

          headers = {}
          for line in headers_text.splitlines():
              if ":" not in line:
                  continue
              key, value = line.split(":", 1)
              headers[key.strip().lower()] = value.strip()

          message = ""
          try:
              parsed = json.loads(body_text)
              error = parsed.get("error", parsed)
              if isinstance(error, dict):
                  message = str(error.get("message") or error.get("detail") or "")
          except Exception:
              pass

          normalized = message.lower()
          if (
              "tokens per day" in normalized
              or "requests per day" in normalized
              or "daily limit" in normalized
              or "daily quota" in normalized
          ):
              limit_scope = "daily_quota"
          elif "tokens per minute" in normalized or "requests per minute" in normalized:
              limit_scope = "transient_rate_limit"
          elif status == 429:
              limit_scope = "unknown_429"
          else:
              limit_scope = "none"

          summary = {
              "probe": probe,
              "http_status": status,
              "limit_scope": limit_scope,
              "retry_after": headers.get("retry-after"),
              "limit_tokens": headers.get("x-ratelimit-limit-tokens"),
              "remaining_tokens": headers.get("x-ratelimit-remaining-tokens"),
              "reset_tokens": headers.get("x-ratelimit-reset-tokens"),
              "remaining_requests": headers.get("x-ratelimit-remaining-requests"),
              "finish_reason": None,
          }

          if status < 400:
              try:
                  parsed = json.loads(body_text)
                  choices = parsed.get("choices") or []
                  if choices:
                      summary["finish_reason"] = choices[0].get("finish_reason")
              except Exception:
                  pass

          out = Path(f"/tmp/groq-readiness/probe-{probe}-summary.json")
          out.write_text(json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary, separators=(",", ":")))
          PY

            if test "$status" -ge 200 && test "$status" -lt 300; then
              success=$((success + 1))
            else
              scope="$(jq -r .limit_scope "/tmp/groq-readiness/probe-${probe}-summary.json")"
              if test "$scope" = "daily_quota"; then
                echo "Groq readiness blocked by daily quota; do not freeze/run canonical v14." >&2
                exit 3
              fi
              echo "Groq readiness probe failed with HTTP $status ($scope)." >&2
              exit 4
            fi

            if test "$probe" -lt 3; then
              sleep 10
            fi
          done

          test "$success" -eq 3
          jq -s '{
            schema_version:"engine-0.6-evidence-relevance-v14-groq-readiness-v1",
            calibration_observation:false,
            model:"openai/gpt-oss-120b",
            probes:.,
            ready:(all(.[]; .http_status >= 200 and .http_status < 300))
          }' /tmp/groq-readiness/probe-*-summary.json \
            > /tmp/groq-readiness/summary.json

      - name: Upload sanitized readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-0.6-evidence-relevance-v14-groq-readiness
          path: |
            /tmp/groq-readiness/probe-*-summary.json
            /tmp/groq-readiness/summary.json
          if-no-files-found: warn
