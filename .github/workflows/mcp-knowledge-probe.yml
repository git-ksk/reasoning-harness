name: mcp-knowledge-probe

on:
  push:
    branches:
      - experiment/mcp-knowledge-probe
  workflow_dispatch:
    inputs:
      run_holdout:
        description: "Run the frozen agentic holdout (do not use for tuning)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2

      - name: Compile experimental benchmark binaries
        run: |
          set -euo pipefail
          cargo check --locked -p reasoning-harness-cli \
            --bin reason-mcp-knowledge-benchmark \
            --bin reason-mcp-search-benchmark \
            --bin reason-mcp-agentic-search-benchmark

      - name: Smoke Wikipedia MCP server directly
        run: |
          set -euo pipefail
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"page_exists","arguments":{"title":"東京","language":"ja"},"_meta":{"protocolVersion":"2026-07-28"}}}' \
            | python3 scripts/wikipedia_knowledge_mcp.py \
            | tee /tmp/wikipedia-mcp-direct.json
          jq -e '.result.structuredContent.reasoning_harness.facts["wikipedia.page_exists"] == "true"' /tmp/wikipedia-mcp-direct.json >/dev/null

      - name: Layer A - benchmark live Wikidata typed-fact MCP adapter
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo run -q --locked -p reasoning-harness-cli --bin reason-mcp-knowledge-benchmark -- \
            --trials 3 \
            | tee /tmp/mcp-knowledge-benchmark.json

      - name: Layer B - benchmark fixed cross-source search policy
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo run -q --locked -p reasoning-harness-cli --bin reason-mcp-search-benchmark -- \
            --trials 3 \
            | tee /tmp/mcp-search-benchmark.json

      - name: Layer C - benchmark bounded agentic search planner (dev suite)
        continue-on-error: true
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$MISTRAL_API_KEY"
          cargo run -q --locked -p reasoning-harness-cli --bin reason-mcp-agentic-search-benchmark -- \
            --suite dev \
            --trials 5 \
            --model ministral-8b-latest \
            | tee /tmp/mcp-agentic-search-dev.json

      - name: Layer C holdout - explicit dispatch only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_holdout }}
        continue-on-error: true
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$MISTRAL_API_KEY"
          cargo run -q --locked -p reasoning-harness-cli --bin reason-mcp-agentic-search-benchmark -- \
            --suite holdout \
            --trials 2 \
            --model ministral-8b-latest \
            | tee /tmp/mcp-agentic-search-holdout.json

      - name: Summarize layered failure provenance
        if: always()
        run: |
          python3 scripts/summarize_layered_mcp_benchmarks.py \
            --layer-a /tmp/mcp-knowledge-benchmark.json \
            --layer-b /tmp/mcp-search-benchmark.json \
            --layer-c /tmp/mcp-agentic-search-dev.json \
            --output /tmp/mcp-layered-summary.json \
            | tee /tmp/mcp-layered-summary.stdout.json

      - name: Configure read-only MCP resolver
        run: |
          set -euo pipefail
          # The current admission contract freezes evaluation time before the live tool call.
          # Give this probe a bounded acquisition window so we can separately verify the MCP path.
          EVALUATION_TIME="$(( $(date +%s) + 180 ))"
          cat > /tmp/reason-mcp-wikipedia.json <<JSON
          {
            "schema_version": "reason-config-v1",
            "run": {
              "provider": "mistral",
              "model": "ministral-8b-latest",
              "max_tokens": 512,
              "format": "json"
            },
            "resolution": {
              "mcp_readonly": {
                "server_id": "wikipedia-ja-probe",
                "program": "python3",
                "args": ["scripts/wikipedia_knowledge_mcp.py"],
                "allowed_tools": ["page_exists"],
                "tool": "page_exists",
                "read_only": true,
                "resolver_class": "evidence_acquisition",
                "fixed_arguments": {
                  "title": "東京",
                  "language": "ja"
                },
                "source": "mcp:wikipedia-ja:page_exists",
                "timeout_ms": 15000,
                "max_response_bytes": 262144,
                "admission": {
                  "evaluation_time_unix_seconds": ${EVALUATION_TIME},
                  "authority_ranks": {"primary": 20},
                  "minimum_authority_class": "primary",
                  "sources": {
                    "mcp:wikipedia-ja:page_exists": {
                      "authority_class": "primary",
                      "max_age_seconds": 300
                    }
                  }
                }
              }
            }
          }
          JSON

      - name: Run natural-language Harness with Wikipedia MCP resolution
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$MISTRAL_API_KEY"
          cargo run -q --locked -p reasoning-harness-cli --bin reason -- \
            '日本語版Wikipediaに「東京」という記事が存在するか確認して。確認できる根拠だけで答えて。' \
            --config /tmp/reason-mcp-wikipedia.json \
            --hypothesis wikipedia.page_exists=true \
            --max-resolution-attempts 1 \
            --format json \
            | tee /tmp/reason-mcp-wikipedia-result.json
          jq -e '.result.resolution_rounds[-1].final_verdict == "accept"' /tmp/reason-mcp-wikipedia-result.json >/dev/null
          jq -e '.result.resolution_rounds[-1].attempts[0].status == "applied_evidence"' /tmp/reason-mcp-wikipedia-result.json >/dev/null

      - name: Evaluate development safety gate
        if: always()
        run: |
          set -euo pipefail
          test -s /tmp/mcp-layered-summary.json
          jq -e '
            (.layer_a_adapter != null) and
            (.layer_b_fixed_policy != null) and
            (.layer_c_agentic_planner != null) and
            (.layer_a_adapter.false_acceptances == 0) and
            (.layer_b_fixed_policy.false_acceptances == 0) and
            (.layer_c_agentic_planner.false_acceptances == 0)
          ' /tmp/mcp-layered-summary.json >/dev/null

      - name: Summarize probe result
        if: always()
        run: |
          echo '--- Layered attribution summary ---'
          cat /tmp/mcp-layered-summary.json 2>/dev/null || true
          echo '--- Layer A: Wikidata MCP benchmark aggregate ---'
          jq '.aggregate' /tmp/mcp-knowledge-benchmark.json 2>/dev/null || true
          echo '--- Layer B: fixed cross-source search aggregate ---'
          jq '.aggregate' /tmp/mcp-search-benchmark.json 2>/dev/null || true
          echo '--- Layer C: agentic planner dev aggregate ---'
          jq '.aggregate' /tmp/mcp-agentic-search-dev.json 2>/dev/null || true
          echo '--- Layer C: stop reasons ---'
          jq '.samples[] | {id, trial, expected, final_outcome, stop_reason, rounds, tool_calls, planner_calls, model_tokens, elapsed_ms, passed}' /tmp/mcp-agentic-search-dev.json 2>/dev/null || true
          echo '--- Layer C holdout aggregate (when explicitly run) ---'
          jq '.aggregate' /tmp/mcp-agentic-search-holdout.json 2>/dev/null || true
          echo '--- direct Wikipedia MCP ---'
          cat /tmp/wikipedia-mcp-direct.json 2>/dev/null || true
          echo '--- Harness result: selected fields ---'
          if test -f /tmp/reason-mcp-wikipedia-result.json; then
            jq '.. | objects | with_entries(select(.key | test("verdict|finalization|resolution|resolver|source|fact|operational|grounded"; "i"))) | select(length > 0)' /tmp/reason-mcp-wikipedia-result.json || cat /tmp/reason-mcp-wikipedia-result.json
          fi

      - name: Preserve probe outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-knowledge-probe
          path: |
            /tmp/mcp-knowledge-benchmark.json
            /tmp/mcp-search-benchmark.json
            /tmp/mcp-agentic-search-dev.json
            /tmp/mcp-agentic-search-holdout.json
            /tmp/mcp-layered-summary.json
            /tmp/wikipedia-mcp-direct.json
            /tmp/reason-mcp-wikipedia-result.json
            /tmp/reason-mcp-wikipedia.json
          if-no-files-found: warn
          retention-days: 7
