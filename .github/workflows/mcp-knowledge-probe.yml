name: mcp-knowledge-probe

on:
  push:
    branches:
      - experiment/mcp-knowledge-probe
  workflow_dispatch:
    inputs:
      run_holdout:
        description: "Run the frozen agentic holdout (do not use for tuning)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deterministic-contracts:
    name: Deterministic control contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2

      - name: Compile experimental benchmark binaries
        run: |
          set -euo pipefail
          cargo check --locked -p reasoning-harness-cli \
            --bin reason-mcp-knowledge-benchmark \
            --bin reason-mcp-search-benchmark \
            --bin reason-mcp-agentic-search-benchmark

      - name: Assert target-directed progress contract
        run: |
          set -euo pipefail
          python3 scripts/assert_target_directed_progress_contract.py

      - name: Assert transport retry accounting contract
        run: |
          set -euo pipefail
          python3 scripts/assert_transport_retry_accounting.py

  live-foundation:
    name: Live Layers A/B
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2

      - name: Layer A - live Wikidata typed-fact MCP adapter
        run: |
          set -euo pipefail
          cargo run -q --locked -p reasoning-harness-cli --bin reason-mcp-knowledge-benchmark -- \
            --trials 3 \
            | tee /tmp/mcp-knowledge-benchmark.json

      - name: Layer B - fixed cross-source search policy
        run: |
          set -euo pipefail
          cargo run -q --locked -p reasoning-harness-cli --bin reason-mcp-search-benchmark -- \
            --trials 3 \
            | tee /tmp/mcp-search-benchmark.json

      - name: Classify semantic and infrastructure signals
        if: always()
        run: |
          set -euo pipefail
          python3 scripts/summarize_layered_mcp_benchmarks.py \
            --layer-a /tmp/mcp-knowledge-benchmark.json \
            --layer-b /tmp/mcp-search-benchmark.json \
            --output /tmp/mcp-foundation-summary.json \
            | tee /tmp/mcp-foundation-summary.stdout.json

      - name: Gate live foundation
        if: always()
        run: |
          set -euo pipefail
          test -s /tmp/mcp-foundation-summary.json
          jq -e '
            (.layer_a_adapter.semantic_safety_clean == true) and
            (.layer_b_fixed_policy.semantic_safety_clean == true) and
            (.layer_a_adapter.semantic_capability_clean == true) and
            (.layer_b_fixed_policy.semantic_capability_clean == true) and
            (.layer_a_adapter.infrastructure_clean == true) and
            (.layer_b_fixed_policy.infrastructure_clean == true) and
            (.layer_a_adapter.full_run_clean == true) and
            (.layer_b_fixed_policy.full_run_clean == true)
          ' /tmp/mcp-foundation-summary.json >/dev/null

      - name: Preserve live foundation outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-knowledge-foundation
          path: |
            /tmp/mcp-knowledge-benchmark.json
            /tmp/mcp-search-benchmark.json
            /tmp/mcp-foundation-summary.json
          if-no-files-found: warn
          retention-days: 7

  agentic-dev:
    name: Agentic Layer C dev
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2

      - name: Layer C - bounded agentic search planner
        run: |
          set -euo pipefail
          test -n "$MISTRAL_API_KEY"
          cargo run -q --locked -p reasoning-harness-cli --bin reason-mcp-agentic-search-benchmark -- \
            --suite dev \
            --trials 5 \
            --model ministral-8b-latest \
            | tee /tmp/mcp-agentic-search-dev.json

      - name: Classify agentic capability and infrastructure signals
        if: always()
        run: |
          set -euo pipefail
          python3 scripts/summarize_layered_mcp_benchmarks.py \
            --layer-c /tmp/mcp-agentic-search-dev.json \
            --output /tmp/mcp-agentic-dev-summary.json \
            | tee /tmp/mcp-agentic-dev-summary.stdout.json

      - name: Gate agentic dev suite
        if: always()
        run: |
          set -euo pipefail
          test -s /tmp/mcp-agentic-dev-summary.json
          jq -e '
            (.layer_c_agentic_planner.semantic_safety_clean == true) and
            (.layer_c_agentic_planner.agent_capability_clean == true) and
            (.layer_c_agentic_planner.infrastructure_clean == true) and
            (.layer_c_agentic_planner.full_run_clean == true)
          ' /tmp/mcp-agentic-dev-summary.json >/dev/null

      - name: Summarize Layer C traces
        if: always()
        run: |
          echo '--- Layer C aggregate ---'
          jq '.aggregate' /tmp/mcp-agentic-search-dev.json 2>/dev/null || true
          echo '--- Layer C stop reasons ---'
          jq '.samples[] | {id, trial, expected, final_outcome, stop_reason, rounds, tool_calls, planner_calls, provider_attempts, model_tokens, elapsed_ms, passed}' /tmp/mcp-agentic-search-dev.json 2>/dev/null || true

      - name: Preserve agentic dev outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-knowledge-agentic-dev
          path: |
            /tmp/mcp-agentic-search-dev.json
            /tmp/mcp-agentic-dev-summary.json
          if-no-files-found: warn
          retention-days: 7

  natural-smoke:
    name: Natural-language MCP smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2

      - name: Smoke Wikipedia MCP server directly
        run: |
          set -euo pipefail
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"page_exists","arguments":{"title":"東京","language":"ja"},"_meta":{"protocolVersion":"2026-07-28"}}}' \
            | python3 scripts/wikipedia_knowledge_mcp.py \
            | tee /tmp/wikipedia-mcp-direct.json
          jq -e '.result.structuredContent.reasoning_harness.facts["wikipedia.page_exists"] == "true"' /tmp/wikipedia-mcp-direct.json >/dev/null

      - name: Configure read-only MCP resolver
        run: |
          set -euo pipefail
          # Experimental workaround only: acquisition timestamps may occur after the
          # semantic evaluation time frozen by the current admission contract.
          EVALUATION_TIME="$(( $(date +%s) + 180 ))"
          cat > /tmp/reason-mcp-wikipedia.json <<JSON
          {
            "schema_version": "reason-config-v1",
            "run": {
              "provider": "mistral",
              "model": "ministral-8b-latest",
              "max_tokens": 512,
              "format": "json"
            },
            "resolution": {
              "mcp_readonly": {
                "server_id": "wikipedia-ja-probe",
                "program": "python3",
                "args": ["scripts/wikipedia_knowledge_mcp.py"],
                "allowed_tools": ["page_exists"],
                "tool": "page_exists",
                "read_only": true,
                "resolver_class": "evidence_acquisition",
                "fixed_arguments": {
                  "title": "東京",
                  "language": "ja"
                },
                "source": "mcp:wikipedia-ja:page_exists",
                "timeout_ms": 15000,
                "max_response_bytes": 262144,
                "admission": {
                  "evaluation_time_unix_seconds": ${EVALUATION_TIME},
                  "authority_ranks": {"primary": 20},
                  "minimum_authority_class": "primary",
                  "sources": {
                    "mcp:wikipedia-ja:page_exists": {
                      "authority_class": "primary",
                      "max_age_seconds": 300
                    }
                  }
                }
              }
            }
          }
          JSON

      - name: Run natural-language Harness with Wikipedia MCP resolution
        run: |
          set -euo pipefail
          test -n "$MISTRAL_API_KEY"
          cargo run -q --locked -p reasoning-harness-cli --bin reason -- \
            '日本語版Wikipediaに「東京」という記事が存在するか確認して。確認できる根拠だけで答えて。' \
            --config /tmp/reason-mcp-wikipedia.json \
            --hypothesis wikipedia.page_exists=true \
            --max-resolution-attempts 1 \
            --format json \
            | tee /tmp/reason-mcp-wikipedia-result.json
          jq -e '.result.resolution_rounds[-1].final_verdict == "accept"' /tmp/reason-mcp-wikipedia-result.json >/dev/null
          jq -e '.result.resolution_rounds[-1].attempts[0].status == "applied_evidence"' /tmp/reason-mcp-wikipedia-result.json >/dev/null

      - name: Preserve natural smoke outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-knowledge-natural-smoke
          path: |
            /tmp/wikipedia-mcp-direct.json
            /tmp/reason-mcp-wikipedia-result.json
            /tmp/reason-mcp-wikipedia.json
          if-no-files-found: warn
          retention-days: 7

  holdout:
    name: Frozen agentic holdout
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_holdout }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2

      - name: Run frozen holdout
        run: |
          set -euo pipefail
          test -n "$MISTRAL_API_KEY"
          cargo run -q --locked -p reasoning-harness-cli --bin reason-mcp-agentic-search-benchmark -- \
            --suite holdout \
            --trials 2 \
            --model ministral-8b-latest \
            | tee /tmp/mcp-agentic-search-holdout.json

      - name: Classify holdout signals
        if: always()
        run: |
          set -euo pipefail
          python3 scripts/summarize_layered_mcp_benchmarks.py \
            --layer-c /tmp/mcp-agentic-search-holdout.json \
            --output /tmp/mcp-agentic-holdout-summary.json \
            | tee /tmp/mcp-agentic-holdout-summary.stdout.json

      - name: Gate frozen holdout without retuning
        if: always()
        run: |
          set -euo pipefail
          test -s /tmp/mcp-agentic-holdout-summary.json
          jq -e '
            (.layer_c_agentic_planner.semantic_safety_clean == true) and
            (.layer_c_agentic_planner.agent_capability_clean == true) and
            (.layer_c_agentic_planner.infrastructure_clean == true) and
            (.layer_c_agentic_planner.full_run_clean == true)
          ' /tmp/mcp-agentic-holdout-summary.json >/dev/null

      - name: Preserve holdout outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-knowledge-agentic-holdout
          path: |
            /tmp/mcp-agentic-search-holdout.json
            /tmp/mcp-agentic-holdout-summary.json
          if-no-files-found: warn
          retention-days: 14

  layered-summary:
    name: Layered attribution summary
    if: always()
    needs:
      - live-foundation
      - agentic-dev
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Download foundation report
        uses: actions/download-artifact@v5
        with:
          name: mcp-knowledge-foundation
          path: /tmp/foundation
        continue-on-error: true

      - name: Download agentic report
        uses: actions/download-artifact@v5
        with:
          name: mcp-knowledge-agentic-dev
          path: /tmp/agentic
        continue-on-error: true

      - name: Build combined attribution report
        run: |
          set -euo pipefail
          python3 scripts/summarize_layered_mcp_benchmarks.py \
            --layer-a /tmp/foundation/mcp-knowledge-benchmark.json \
            --layer-b /tmp/foundation/mcp-search-benchmark.json \
            --layer-c /tmp/agentic/mcp-agentic-search-dev.json \
            --output /tmp/mcp-layered-summary.json \
            | tee /tmp/mcp-layered-summary.stdout.json
          cat /tmp/mcp-layered-summary.json

      - name: Preserve combined attribution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-knowledge-layered-summary
          path: /tmp/mcp-layered-summary.json
          if-no-files-found: warn
          retention-days: 7
