name: product-external-info-v4-freeze

on:
  pull_request:
    paths:
      - 'fixtures/product-external-info-v4/**'
      - 'fixtures/product-external-info-v4.sha256'
      - 'scripts/validate_product_external_info_v4.py'
      - 'crates/reasoning-harness-cli/src/bin/product_external_info_v4.rs'
      - 'crates/reasoning-harness-cli/Cargo.toml'
      - 'docs/product-external-info-v4.md'
      - 'docs/product-external-info-v4.ja.md'
      - '.github/workflows/product-external-info-v4-freeze.yml'
      - '.github/workflows/product-external-info-v4-live.yml'
  push:
    branches:
      - feat/206-product-external-info-successor
    paths:
      - 'fixtures/product-external-info-v4/**'
      - 'fixtures/product-external-info-v4.sha256'
      - 'scripts/validate_product_external_info_v4.py'
      - 'crates/reasoning-harness-cli/src/bin/product_external_info_v4.rs'
      - 'crates/reasoning-harness-cli/Cargo.toml'
      - '.github/workflows/product-external-info-v4-freeze.yml'
      - '.github/workflows/product-external-info-v4-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-v4-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Validate v4 freeze and historical immutability
        run: |
          set -euo pipefail
          python3 scripts/validate_product_external_info_v4.py | tee /tmp/v4-freeze.json
          jq -e '
            .valid == true
            and .live_observation_performed == false
            and .corpus_identity == "product-external-info-v4"
            and .comparison_contract == "matched-target-context-four-arm-v4"
            and .cases == 21
            and .capability_families == 7
            and .v1_v2_v3_case_or_target_reuse == false
            and .pre_provider_acquisition_preflight_required == true
            and .provider == "mistral"
            and .model == "ministral-8b-latest"
            and .seed == 28000
            and .max_tokens == 1024
          ' /tmp/v4-freeze.json >/dev/null
          (cd fixtures/product-external-info-v4 && sha256sum -c ../product-external-info-v4.sha256)
          (cd fixtures/product-external-info-v3 && sha256sum -c ../product-external-info-v3.sha256)
          (cd fixtures/product-external-info-v2 && sha256sum -c ../product-external-info-v2.sha256)
          (cd fixtures/product-external-info-v1 && sha256sum -c ../product-external-info-v1.sha256)
          (cd fixtures/product-dogfood-v1 && sha256sum -c ../product-dogfood-v1.sha256)
          git diff --exit-code ddaedd491941189a4d409de9bfe149b5d79abefd -- \
            fixtures/product-external-info-v3 fixtures/product-external-info-v3.sha256 \
            scripts/validate_product_external_info_v3.py \
            crates/reasoning-harness-cli/src/bin/product_external_info_v3.rs \
            .github/workflows/product-external-info-v3-live.yml
          git diff --exit-code 103b898cc6fe6f41b4fd30c8debdef08f9d5ec7c -- \
            fixtures/product-external-info-v2 fixtures/product-external-info-v2.sha256 \
            scripts/validate_product_external_info_v2.py \
            crates/reasoning-harness-cli/src/bin/product_external_info_successor.rs
          git diff --exit-code a365a46d5fa948063e9ac745ad14646c23456ede -- \
            crates/reasoning-harness-providers/src/mcp_readonly.rs \
            crates/reasoning-harness-providers/src/external_admission.rs \
            crates/reasoning-harness-core/src/finalization.rs

      - name: Validate v4 evaluator wiring without network or credentials
        run: |
          set -euo pipefail
          cargo run -q --locked -p reasoning-harness-cli --bin reason-product-external-info-v4 -- \
            --validate-only --seed 28000 --max-tokens 1024 > /tmp/v4-evaluator.json
          jq -e '
            .schema_version == "reason-product-external-info-v4"
            and .comparison_contract == "matched-target-context-four-arm-v4"
            and .corpus_identity == "product-external-info-v4"
            and .seed == 28000
            and .max_tokens == 1024
            and .aggregate.total_cases == 21
            and .aggregate.semantic_cases == 18
            and .aggregate.operational_cases == 3
            and .comparison.raw_model_no_external.semantic_cases_scored == 18
            and .comparison.harness_no_external.semantic_cases_scored == 18
            and .comparison.raw_model_with_external.semantic_cases_scored == 18
            and .comparison.harness_with_mcp_external.semantic_cases_scored == 18
            and (.costs | has("primary_overhead"))
          ' /tmp/v4-evaluator.json >/dev/null

      - name: Test unchanged safety boundaries and v4 compile
        run: |
          set -euo pipefail
          cargo test --locked -p reasoning-harness-providers mcp_readonly -- --nocapture
          cargo test --locked -p reasoning-harness-providers external_admission -- --nocapture
          cargo test --locked -p reasoning-harness-core finalization -- --nocapture
          cargo test --locked -p reasoning-harness-cli --bin reason-product-external-info-v4
          cargo check --locked -p reasoning-harness-cli --bin reason-product-external-info-v4
          cargo fmt --all -- --check
          git diff --check
