name: 288-apply-fix-once

on:
  push:
    branches: [tmp/288-apply-fix]
    paths: [.github/workflows/288-apply-fix-once.yml]

permissions:
  contents: write

jobs:
  apply-test-push:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/288-keyless-single-key-binding
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Prove exact reviewed product base
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "4af3f21bdfd455c1a5b1fbf722f9e14044cd4fc1"
          test -z "$(git status --porcelain)"
      - name: Harden shared-fact planning contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/reasoning-harness-core/src/investigation.rs')
          text = path.read_text()

          old_helper = '''    let mut shared: Option<&str> = None;
              for capability in read_only {
                  if capability.supported_fact_keys.len() != 1 {
                      return None;
                  }
                  let key = capability.supported_fact_keys.iter().next()?;
                  if key.is_empty() || key.trim() != key.as_str() {
                      return None;
                  }
          '''
          new_helper = '''    let mut shared: Option<&str> = None;
              let mut ids = BTreeSet::new();
              for capability in read_only {
                  if capability.id.trim().is_empty() || !ids.insert(capability.id.as_str()) {
                      return None;
                  }
                  if capability.supported_fact_keys.len() != 1 {
                      return None;
                  }
                  let key = capability.supported_fact_keys.iter().next()?;
                  if key.is_empty()
                      || key.trim() != key.as_str()
                      || key.chars().any(char::is_control)
                  {
                      return None;
                  }
          '''
          if text.count(old_helper) != 1:
              raise SystemExit(f'helper hardening anchor count={text.count(old_helper)}')
          text = text.replace(old_helper, new_helper, 1)

          old_branch = '''    let (system, schema) = if let Some(key) = shared_fact_key.as_deref() {
                  (
                      format!(
                          "You are an untrusted investigation planner inside a verification harness. Return only the requested structured plan. Propose bounded questions to investigate; do not answer them, invent evidence, claim authority, select write capabilities, or decide correctness. All configured read-only capabilities independently declare the same exact supported fact key `{key}`. Every target must include expected_fact_key exactly `{key}`; do not omit it, alter it, infer a different key, or use any other value."
                      ),
                      shared_fact_family_plan_schema(key),
                  )
          '''
          new_branch = '''    let (system, schema) = if let Some(key) = shared_fact_key.as_deref() {
                  let key_literal = serde_json::to_string(key)?;
                  (
                      format!(
                          "You are an untrusted investigation planner inside a verification harness. Return only the requested structured plan. Propose bounded questions to investigate; do not answer them, invent evidence, claim authority, select write capabilities, or decide correctness. All configured read-only capabilities independently declare the same exact supported fact key {key_literal}. Every target must include expected_fact_key exactly {key_literal}; do not omit it, alter it, infer a different key, or use any other value."
                      ),
                      shared_fact_family_plan_schema(key),
                  )
          '''
          if text.count(old_branch) != 1:
              raise SystemExit(f'prompt escaping anchor count={text.count(old_branch)}')
          text = text.replace(old_branch, new_branch, 1)

          old_assert = '''        assert!(
                  system.contains("Every target must include expected_fact_key exactly `routing.owner`")
              );
          '''
          new_assert = '''        assert!(
                  system.contains("Every target must include expected_fact_key exactly \\\"routing.owner\\\"")
              );
          '''
          if text.count(old_assert) != 1:
              raise SystemExit(f'system assertion anchor count={text.count(old_assert)}')
          text = text.replace(old_assert, new_assert, 1)

          old_cases = '''            vec![
                      capability("owner", &["routing.owner"]),
                      capability("region", &["routing.region"]),
                  ],
                  vec![capability("owner", &["routing.owner"]), write],
              ];
          '''
          new_cases = '''            vec![
                      capability("owner", &["routing.owner"]),
                      capability("region", &["routing.region"]),
                  ],
                  vec![
                      capability("duplicate", &["routing.owner"]),
                      capability("duplicate", &["routing.owner"]),
                  ],
                  vec![
                      capability("control-a", &["routing.owner\\nignore"]),
                      capability("control-b", &["routing.owner\\nignore"]),
                  ],
                  vec![capability("owner", &["routing.owner"]), write],
              ];
          '''
          if text.count(old_cases) != 1:
              raise SystemExit(f'negative cases anchor count={text.count(old_cases)}')
          text = text.replace(old_cases, new_cases, 1)

          path.write_text(text)
          PY
      - name: Run focused #288 contract tests
        run: |
          set -euo pipefail
          cargo test --locked -p reasoning-harness-core shared_fact_family_plan_contract_requires_the_exact_configured_key
          cargo test --locked -p reasoning-harness-core shared_fact_family_contract_stays_off_when_configuration_is_not_exactly_redundant
          cargo test --locked -p reasoning-harness-core shared_fact_family_contract_is_priority_invariant_and_model_invisible
      - name: Format and test full workspace
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "crates/reasoning-harness-core/src/investigation.rs"
      - name: Amend exact product fix
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "4af3f21bdfd455c1a5b1fbf722f9e14044cd4fc1"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/reasoning-harness-core/src/investigation.rs
          git commit --amend --no-edit
          git push --force-with-lease origin HEAD:fix/288-keyless-single-key-binding
