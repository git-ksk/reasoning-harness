name: engine-0.6-evidence-relevance-successor-v10-development-v3

on:
  push:
    tags:
      - engine-0.6-evidence-relevance-successor-v10-development-v3-freeze

permissions:
  contents: read

env:
  DEVELOPMENT_DIR: fixtures/evidence-relevance-successor-v10-development-v3
  DEVELOPMENT_SEED: '4683000'
  FREEZE_TAG: engine-0.6-evidence-relevance-successor-v10-development-v3-freeze

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Reject reruns and enforce frozen tag
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_REF_NAME" = "$FREEZE_TAG"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Revalidate immutable predecessors
        run: |
          set -euo pipefail
          test "$(git rev-list -n1 engine-0.6-evidence-relevance-successor-v10-development-v1-freeze)" = "7c21f3e3d207da72027924114009795b7508e167"
          test "$(git rev-list -n1 engine-0.6-evidence-relevance-successor-v10-development-v2-freeze)" = "44796d470fdbb359ea1356dad121aa9417a98cb7"
          test "$(git rev-list -n1 engine-0.6-evidence-relevance-holdout-v10-freeze)" = "4aa3aac37ea1a4110e4bf69b498661bc3599a36a"
          git diff --exit-code be1657b..HEAD --             fixtures/evidence-relevance-successor-v10-development-v2-result             docs/engine-0.6-evidence-relevance-successor-v10-development-v2-result.md             docs/engine-0.6-evidence-relevance-successor-v10-development-v2-result.ja.md
      - name: Revalidate frozen v3 surface
        run: |
          set -euo pipefail
          sha256sum -c "$DEVELOPMENT_DIR/surface-v3.sha256"
          cargo run -q --locked -p reasoning-harness-cli \
            --bin reason-evidence-relevance-successor-v10-development-v3-study -- \
            "$DEVELOPMENT_DIR" --provider mistral --model development-placeholder \
            --seed "$DEVELOPMENT_SEED" --validate-only \
            > /tmp/evidence-relevance-successor-v10-v3-validate.json
          jq -e '
            .configuration_id == "evidence-relevance-successor-v10-development-v3"
            and .suite_id == "evidence-relevance-successor-v10-development-v3"
            and .issue == 468
            and .annotation_protocol_id == "evidence-relevance-effective-qualification-v14-materialization-v27"
            and .fixed_core_id == "evidence-relevance-fixed-core-successor-v10-development-v3"
            and .planned_cases == 20
            and .completed_cases == 0
            and .scorability == "validate_only_non_scorable"
          ' /tmp/evidence-relevance-successor-v10-v3-validate.json >/dev/null
      - name: Validate deterministic and historical boundaries
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy -p reasoning-harness-core --all-targets -- -D warnings
          cargo clippy -p reasoning-harness-cli \
            --bin reason-evidence-relevance-successor-v10-development-v3-study -- -D warnings
          cargo test -p reasoning-harness-core --lib
          cargo test -p reasoning-harness-core --test evidence_relevance_successor_v10_development_v3
          cargo test -p reasoning-harness-core --test evidence_relevance_successor_v10_materialization_v27_replay
          cargo test -p reasoning-harness-core --test evidence_relevance_successor_v10_development_v2
          cargo test -p reasoning-harness-core --test evidence_relevance_successor_v10_development
          cargo test -p reasoning-harness-core --test evidence_relevance_successor_v9_relation_controls
          cargo test -p reasoning-harness-core --test evidence_relevance_successor_v9_historical_replay
          cargo test -p reasoning-harness-core --test evidence_relevance_successor_v9_development
          cargo test -p reasoning-harness-core --test evidence_relevance_holdout_v10
          cargo test -p reasoning-harness-cli \
            --bin reason-evidence-relevance-successor-v10-development-v3-study
      - name: Preserve preflight
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: engine-0.6-evidence-relevance-successor-v10-development-v3-preflight
          path: /tmp/evidence-relevance-successor-v10-v3-validate.json
          if-no-files-found: warn
          retention-days: 30

  live:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - provider: mistral
            model: ministral-8b-latest
            inter_case_delay_ms: 1200
            timeout_minutes: 60
          - provider: google
            model: gemini-3.5-flash-lite
            inter_case_delay_ms: 6100
            timeout_minutes: 90
    concurrency:
      group: engine-0.6-evidence-relevance-successor-v10-development-v3-${{ matrix.provider }}
      cancel-in-progress: false
    steps:
      - name: Reject reruns and enforce frozen tag
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_REF_NAME" = "$FREEZE_TAG"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88.0'
      - uses: Swatinem/rust-cache@v2
      - name: Revalidate surface before credentials
        run: |
          set -euo pipefail
          sha256sum -c "$DEVELOPMENT_DIR/surface-v3.sha256"
          cargo run -q --locked -p reasoning-harness-cli \
            --bin reason-evidence-relevance-successor-v10-development-v3-study -- \
            "$DEVELOPMENT_DIR" --provider mistral --model development-placeholder \
            --seed "$DEVELOPMENT_SEED" --validate-only > /dev/null
      - name: Check provider credential
        env:
          PROVIDER: ${{ matrix.provider }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          case "$PROVIDER" in
            mistral) test -n "$MISTRAL_API_KEY" ;;
            google) test -n "$GEMINI_API_KEY" ;;
            *) exit 2 ;;
          esac
      - name: Run first v3 development observation
        env:
          PROVIDER: ${{ matrix.provider }}
          MODEL: ${{ matrix.model }}
          DELAY_MS: ${{ matrix.inter_case_delay_ms }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REASON_GOOGLE_MIN_REQUEST_INTERVAL_MS: '6000'
          REASON_GOOGLE_ATTEMPT_TELEMETRY_PATH: /tmp/evidence-relevance-google-attempts.jsonl
        run: |
          set -u
          BASE="/tmp/evidence-relevance-$PROVIDER"
          set +e
          cargo run -q --locked -p reasoning-harness-cli \
            --bin reason-evidence-relevance-successor-v10-development-v3-study -- \
            "$DEVELOPMENT_DIR" --provider "$PROVIDER" --model "$MODEL" \
            --seed "$DEVELOPMENT_SEED" --inter-case-delay-ms "$DELAY_MS" \
            --continue-after-operational-failures \
            --checkpoint "$BASE-checkpoint.json" \
            > "$BASE-result.json" 2> "$BASE-stderr.log"
          RC=$?
          set -e
          printf '%s\n' "$RC" > "$BASE.rc"
          if test -f "$BASE-result.json"; then
            jq '{configuration_id,suite_id,issue,provider,model,candidate_commit,planned_cases,completed_cases,scorability,operational_abort,provider_arm_latch,metrics:{successful_provider_cases,failed_provider_cases,effective_local_qualification_exact_matches,effective_qualification_identity_scope_misses,effective_qualification_relation_scope_misses,materialized_exact_matches,correctness_wrong_target_relevance_retention,false_relevance_rejections,relevant_left_ambiguous,utility_misses,total_tokens}}' "$BASE-result.json"
          fi
          exit 0
      - name: Preserve v3 development evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: engine-0.6-evidence-relevance-successor-v10-development-v3-live-${{ matrix.provider }}
          path: |
            /tmp/evidence-relevance-${{ matrix.provider }}*
            /tmp/evidence-relevance-google-attempts.jsonl
          if-no-files-found: warn
          retention-days: 30

  final-gate:
    needs: live
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: engine-0.6-evidence-relevance-successor-v10-development-v3-live-*
          path: /tmp/evidence-relevance-v3
          merge-multiple: true
      - name: Evaluate v27 composition development gate
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('/tmp/evidence-relevance-v3')
          manifest = json.loads(Path('fixtures/evidence-relevance-successor-v10-development-v3/manifest.json').read_text())
          cases = {case['id']: case for case in manifest['cases']}
          expected = {
              'mistral': 'ministral-8b-latest',
              'google': 'gemini-3.5-flash-lite',
          }
          summary = {
              'schema_version': 'engine-0.6-evidence-relevance-successor-v10-development-v3-summary-v1',
              'holdout_acceptance_evidence': False,
              'candidate_semantics': 'effective-v14-materialization-v27-effective-composition',
              'providers': {},
              'development_gate_passed': True,
          }

          for provider, model in expected.items():
              result_path = root / f'evidence-relevance-{provider}-result.json'
              rc_path = root / f'evidence-relevance-{provider}.rc'
              if not result_path.exists() or not rc_path.exists():
                  summary['providers'][provider] = {'missing': True, 'passed': False}
                  summary['development_gate_passed'] = False
                  continue

              result = json.loads(result_path.read_text())
              rc = int(rc_path.read_text().strip())
              metrics = result.get('metrics', {})
              observations = {item['id']: item for item in result.get('observations', [])}
              authority_failures = []
              identity_risk_failures = []
              materialization_failures = []

              for case_id, case in cases.items():
                  obs = observations.get(case_id)
                  if obs is None:
                      authority_failures.append({'id': case_id, 'reason': 'missing_observation'})
                      continue
                  effective = obs.get('effective_local_qualification') or {}
                  expected_local = case['expected_local_qualification']
                  relation = effective.get('relation_scope')
                  mode = case['authority_expectation']

                  if effective.get('identity_scope') != expected_local['identity_scope']:
                      identity_risk_failures.append({
                          'id': case_id, 'axis': 'identity_scope',
                          'expected': expected_local['identity_scope'],
                          'actual': effective.get('identity_scope'),
                      })
                  if effective.get('scope_risk') != expected_local['scope_risk']:
                      identity_risk_failures.append({
                          'id': case_id, 'axis': 'scope_risk',
                          'expected': expected_local['scope_risk'],
                          'actual': effective.get('scope_risk'),
                      })

                  if mode == 'require_different':
                      if relation != 'different_relation':
                          authority_failures.append({'id': case_id, 'mode': mode, 'actual': relation})
                  elif mode == 'require_requested':
                      if relation != 'requested_relation':
                          authority_failures.append({'id': case_id, 'mode': mode, 'actual': relation})
                  elif mode == 'forbid_different':
                      if relation == 'different_relation':
                          authority_failures.append({'id': case_id, 'mode': mode, 'actual': relation})
                  elif mode == 'preserve_risk':
                      pass
                  else:
                      authority_failures.append({'id': case_id, 'reason': f'unknown_authority_expectation:{mode}'})

                  if obs.get('materialized_disposition') != case['expected_disposition']:
                      materialization_failures.append({
                          'id': case_id,
                          'expected': case['expected_disposition'],
                          'actual': obs.get('materialized_disposition'),
                      })

              complete = (
                  rc == 0
                  and result.get('configuration_id') == 'evidence-relevance-successor-v10-development-v3'
                  and result.get('suite_id') == 'evidence-relevance-successor-v10-development-v3'
                  and result.get('issue') == 468
                  and result.get('annotation_protocol_id') == 'evidence-relevance-effective-qualification-v14-materialization-v27'
                  and result.get('fixed_core_id') == 'evidence-relevance-fixed-core-successor-v10-development-v3'
                  and result.get('candidate_commit') == os.environ['EXPECTED_SHA']
                  and result.get('provider') == provider
                  and result.get('model') == model
                  and result.get('planned_cases') == 20
                  and result.get('completed_cases') == 20
                  and result.get('canonical_full_holdout') is False
                  and result.get('scorability') == 'complete_development_observation'
                  and result.get('operational_abort') is None
                  and result.get('provider_arm_latch') is None
                  and metrics.get('successful_provider_cases') == 20
                  and metrics.get('failed_provider_cases') == 0
                  and metrics.get('provider_attempts_incomplete_observations') == 0
              )
              passed = (
                  complete
                  and not authority_failures
                  and not identity_risk_failures
                  and not materialization_failures
                  and metrics.get('materialized_exact_matches') == 20
                  and metrics.get('correctness_wrong_target_relevance_retention') == 0
                  and metrics.get('false_relevance_rejections') == 0
                  and metrics.get('relevant_left_ambiguous') == 0
                  and metrics.get('utility_misses') == 0
              )

              summary['providers'][provider] = {
                  'model': model,
                  'runner_rc': rc,
                  'complete': complete,
                  'authority_failures': authority_failures,
                  'identity_risk_failures': identity_risk_failures,
                  'materialization_failures': materialization_failures,
                  'proposal_exact_matches': metrics.get('proposal_exact_matches'),
                  'local_qualification_exact_matches': metrics.get('local_qualification_exact_matches'),
                  'effective_local_qualification_exact_matches': metrics.get('effective_local_qualification_exact_matches'),
                  'materialized_exact_matches': metrics.get('materialized_exact_matches'),
                  'total_tokens': metrics.get('total_tokens'),
                  'passed': passed,
              }
              summary['development_gate_passed'] &= passed

          out = Path('/tmp/evidence-relevance-successor-v10-development-v3-summary.json')
          out.write_text(json.dumps(summary, indent=2) + '\n')
          print(out.read_text())
          if not summary['development_gate_passed']:
              raise SystemExit(1)
          PY
      - name: Preserve v3 development summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: engine-0.6-evidence-relevance-successor-v10-development-v3-summary
          path: /tmp/evidence-relevance-successor-v10-development-v3-summary.json
          if-no-files-found: warn
          retention-days: 30
