name: live-benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mistral:
    name: mistral-${{ matrix.model }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        model:
          - ministral-3b-latest
          - ministral-8b-latest
          - ministral-14b-latest
          - mistral-small-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Run live Mistral benchmark trial
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MODEL: ${{ matrix.model }}
        run: |
          test -n "$MISTRAL_API_KEY"
          cargo run -q --locked -p reasoning-harness-cli -- \
            eval fixtures \
            --provider mistral \
            --model "$MODEL" \
            --max-tokens 4096 \
            --trials 1 \
            --format json \
            > "/tmp/reason-live-${MODEL}.json"
          jq '{model: "'"$MODEL"'", comparison: .comparison, operational: .operational}' "/tmp/reason-live-${MODEL}.json"

  google:
    name: google-${{ matrix.model }}
    runs-on: ubuntu-latest
    # Keep probing 26B without making the diagnostic matrix unusable while its latency is characterized.
    continue-on-error: ${{ matrix.model == 'gemma-4-26b-a4b-it' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        model:
          - gemma-4-26b-a4b-it
          - gemma-4-31b-it
          - gemini-3.1-flash-lite
          - gemini-3.5-flash-lite
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Check Gemini API credential availability
        id: credential
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GEMINI_API_KEY is not configured; skipping Google live benchmark."
          fi
      - name: Run live Google benchmark trial
        if: steps.credential.outputs.available == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL: ${{ matrix.model }}
        run: |
          cargo run -q --locked -p reasoning-harness-cli -- \
            eval fixtures \
            --provider google \
            --model "$MODEL" \
            --max-tokens 4096 \
            --trials 1 \
            --format json \
            > "/tmp/reason-live-${MODEL}.json"
          jq '{model: "'"$MODEL"'", comparison: .comparison, operational: .operational}' "/tmp/reason-live-${MODEL}.json"
