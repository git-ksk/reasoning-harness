name: live-benchmark

on:
  workflow_dispatch:
    inputs:
      mistral_model:
        description: Optional single Mistral model to run
        required: false
        type: choice
        options:
          - all
          - none
          - ministral-3b-latest
          - ministral-8b-latest
          - ministral-14b-latest
          - mistral-small-latest
        default: all
      google_model:
        description: Optional single Google model to run
        required: false
        type: choice
        options:
          - all
          - none
          - gemma-4-26b-a4b-it
          - gemma-4-31b-it
          - gemini-3.1-flash-lite
          - gemini-3.5-flash-lite
        default: all

permissions:
  contents: read

jobs:
  mistral:
    if: inputs.mistral_model != 'none'
    name: mistral-${{ matrix.model }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(inputs.mistral_model == 'all' && '["ministral-3b-latest","ministral-8b-latest","ministral-14b-latest","mistral-small-latest"]' || format('["{0}"]', inputs.mistral_model)) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Run live Mistral benchmark trial
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MODEL: ${{ matrix.model }}
        run: |
          test -n "$MISTRAL_API_KEY"
          cargo run -q --locked -p reasoning-harness-cli -- \
            eval fixtures \
            --provider mistral \
            --model "$MODEL" \
            --max-tokens 4096 \
            --trials 1 \
            --format json \
            > "/tmp/reason-live-${MODEL}.json"
          jq '{model: "'"$MODEL"'", comparison: .comparison, operational: .operational, deterministic_failures: [.cases[] | select(.result.harness.deterministic_failure == true) | {fixture_id: .result.fixture_id, reason: .result.harness.deterministic_failure_reason}]}' "/tmp/reason-live-${MODEL}.json"

  google:
    if: inputs.google_model != 'none'
    name: google-${{ matrix.model }}
    runs-on: ubuntu-latest
    # Keep probing 26B without making the diagnostic matrix unusable while its latency is characterized.
    continue-on-error: ${{ matrix.model == 'gemma-4-26b-a4b-it' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        model: ${{ fromJSON(inputs.google_model == 'all' && '["gemma-4-26b-a4b-it","gemma-4-31b-it","gemini-3.1-flash-lite","gemini-3.5-flash-lite"]' || format('["{0}"]', inputs.google_model)) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Check Gemini API credential availability
        id: credential
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GEMINI_API_KEY is not configured; skipping Google live benchmark."
          fi
      - name: Run live Google benchmark trial
        if: steps.credential.outputs.available == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL: ${{ matrix.model }}
        run: |
          MAX_TOKENS=4096
          if [ "$MODEL" = "gemma-4-26b-a4b-it" ]; then
            MAX_TOKENS=8192
          fi
          cargo run -q --locked -p reasoning-harness-cli -- \
            eval fixtures \
            --provider google \
            --model "$MODEL" \
            --max-tokens "$MAX_TOKENS" \
            --trials 1 \
            --format json \
            > "/tmp/reason-live-${MODEL}.json"
          jq '{model: "'"$MODEL"'", comparison: .comparison, operational: .operational, deterministic_failures: [.cases[] | select(.result.harness.deterministic_failure == true) | {fixture_id: .result.fixture_id, reason: .result.harness.deterministic_failure_reason}]}' "/tmp/reason-live-${MODEL}.json"
