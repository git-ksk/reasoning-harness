name: live-benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mistral:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Run one live Mistral benchmark trial
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          test -n "$MISTRAL_API_KEY"
          cargo run -q --locked -p reasoning-harness-cli -- \
            eval fixtures \
            --provider mistral \
            --model ministral-8b-latest \
            --trials 1 \
            --format json \
            > /tmp/reason-live-benchmark.json
          jq '.aggregate // .' /tmp/reason-live-benchmark.json
