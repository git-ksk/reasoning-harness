name: evidence-sufficiency-holdout-v1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  holdout:
    name: ${{ matrix.provider }}-${{ matrix.model }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: mistral
            model: ministral-8b-latest
          - provider: google
            model: gemma-4-31b-it
    concurrency:
      group: reasoning-harness-sufficiency-holdout-v1-${{ matrix.provider }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Check provider credential availability
        env:
          PROVIDER: ${{ matrix.provider }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          case "$PROVIDER" in
            mistral) KEY="$MISTRAL_API_KEY" ;;
            google) KEY="$GEMINI_API_KEY" ;;
            *) echo "unsupported provider: $PROVIDER" >&2; exit 2 ;;
          esac
          test -n "$KEY"
      - name: Verify frozen holdout checksum
        run: shasum -a 256 -c fixtures/evidence-sufficiency-holdout-v1.sha256
      - name: Run frozen fresh sufficiency holdout
        env:
          PROVIDER: ${{ matrix.provider }}
          MODEL: ${{ matrix.model }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          OUTPUT=/tmp/evidence-sufficiency-holdout-v1.json
          cargo run -q --locked -p reasoning-harness-cli --bin reason-sufficiency-study -- \
            fixtures/evidence-sufficiency-holdout-v1 \
            --surface holdout \
            --provider "$PROVIDER" \
            --model "$MODEL" \
            --trials 5 \
            --max-tokens 128 \
            --seed 7000 \
            > "$OUTPUT"
          jq '{study_id, phase, corpus, provider, requested_model, trials, fixture_count, authority_semantics, configuration_id, metrics, stability: {requested_trials: .stability.requested_trials, complete_trials: .stability.complete_trials, incomplete_trials: .stability.incomplete_trials, exact_unanimity_rate: .stability.exact_unanimity_rate, binary_unanimity_rate: .stability.binary_unanimity_rate}}' "$OUTPUT"
      - name: Enforce frozen holdout promotion thresholds
        run: |
          set -euo pipefail
          jq -e '
            .metrics.operational_completion_rate == 1 and
            .metrics.conservative_binary_accuracy >= 0.95 and
            .metrics.false_safe_count == 0 and
            .metrics.false_abstain_rate <= 0.05 and
            .metrics.per_label_recall.sufficient >= 0.95 and
            .stability.binary_unanimity_rate == 1
          ' /tmp/evidence-sufficiency-holdout-v1.json >/dev/null
      - name: Preserve frozen holdout result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-sufficiency-holdout-v1-${{ matrix.provider }}-${{ matrix.model }}
          path: /tmp/evidence-sufficiency-holdout-v1.json
          if-no-files-found: error
          retention-days: 30
