name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Verify frozen Engine 0.7 development baseline
        run: |
          set -euo pipefail
          git fetch --force origin refs/tags/engine-0.7-baseline-v1-spec-freeze:refs/tags/engine-0.7-baseline-v1-spec-freeze
          test "$(git rev-parse 'engine-0.7-baseline-v1-spec-freeze^{commit}')" = 'd874bd3a98618a1d61ed3de50e9376d79d07dfa8'
          cmp fixtures/engine-0.7-baseline-v1/manifest.json \
            <(git show engine-0.7-baseline-v1-spec-freeze:fixtures/engine-0.7-baseline-v1/manifest.json)
          cmp fixtures/engine-0.7-baseline-v1/manifest.sha256 \
            <(git show engine-0.7-baseline-v1-spec-freeze:fixtures/engine-0.7-baseline-v1/manifest.sha256)
          if grep -Eq '^version = "0.6.1"$' crates/reasoning-harness-core/Cargo.toml; then
            cargo test --locked -p reasoning-harness-core --test engine_0_7_dev_baseline_v1 -- \
              --test-threads=1 --nocapture > /tmp/engine-0.7-baseline-v1.log 2>&1
            python3 scripts/engine-0.7-baseline-v1-report.py \
              --log /tmp/engine-0.7-baseline-v1.log --output /tmp/engine-0.7-baseline-v1-result.json
            cmp evaluation/engine-0.7-baseline-v1-result.json /tmp/engine-0.7-baseline-v1-result.json
            python3 -m unittest -v scripts/test_engine_0_7_baseline_v1_report.py
          else
            echo 'Historical Engine 0.6.1 baseline is immutable; run candidate-specific evaluation separately.'
          fi
      - name: Verify frozen Engine 0.7 reconciliation development controls
        run: |
          set -euo pipefail
          git fetch --force origin refs/tags/engine-0.7-reconciliation-dev-v1-spec-freeze:refs/tags/engine-0.7-reconciliation-dev-v1-spec-freeze
          test "$(git rev-parse 'engine-0.7-reconciliation-dev-v1-spec-freeze^{commit}')" = '426b70195623d1b4d7196c5d6a1ab4a2272741c6'
          cmp fixtures/engine-0.7-source-reconciliation-development-v1/manifest.json \
            <(git show engine-0.7-reconciliation-dev-v1-spec-freeze:fixtures/engine-0.7-source-reconciliation-development-v1/manifest.json)
          cmp fixtures/engine-0.7-source-reconciliation-development-v1/manifest.sha256 \
            <(git show engine-0.7-reconciliation-dev-v1-spec-freeze:fixtures/engine-0.7-source-reconciliation-development-v1/manifest.sha256)
          cargo test --locked -p reasoning-harness-core --test source_reconciliation_development_v1 -- \
            --test-threads=1 --nocapture > /tmp/engine-0.7-reconciliation-dev-v1.log 2>&1
          python3 scripts/engine-0.7-reconciliation-dev-v1-report.py \
            --log /tmp/engine-0.7-reconciliation-dev-v1.log --output /tmp/engine-0.7-reconciliation-dev-v1-result.json
          cmp evaluation/engine-0.7-reconciliation-dev-v1-result.json /tmp/engine-0.7-reconciliation-dev-v1-result.json
          python3 -m unittest -v scripts/test_engine_0_7_reconciliation_dev_v1_report.py
      - name: Verify frozen Engine 0.7 target-local source presentation
        run: |
          set -euo pipefail
          git fetch --force origin refs/tags/engine-0.7-target-presentation-dev-v1-spec-freeze:refs/tags/engine-0.7-target-presentation-dev-v1-spec-freeze
          test "$(git rev-parse 'engine-0.7-target-presentation-dev-v1-spec-freeze^{commit}')" = 'f5c098b2f5df2c93f5385a96bde1719c5e313a37'
          cmp fixtures/engine-0.7-target-presentation-dev-v1/manifest.json \
            <(git show engine-0.7-target-presentation-dev-v1-spec-freeze:fixtures/engine-0.7-target-presentation-dev-v1/manifest.json)
          cmp fixtures/engine-0.7-target-presentation-dev-v1/manifest.sha256 \
            <(git show engine-0.7-target-presentation-dev-v1-spec-freeze:fixtures/engine-0.7-target-presentation-dev-v1/manifest.sha256)
          cargo test --locked -p reasoning-harness-core --test target_presentation_development_v1 -- \
            --test-threads=1 --nocapture > /tmp/engine-0.7-target-presentation-v1.log 2>&1
          python3 scripts/engine-0.7-target-presentation-dev-v1-report.py \
            --log /tmp/engine-0.7-target-presentation-v1.log \
            --output /tmp/engine-0.7-target-presentation-v1-result.json
          cmp evaluation/engine-0.7-target-presentation-dev-v1-result.json /tmp/engine-0.7-target-presentation-v1-result.json
          python3 -m unittest -v scripts/test_engine_0_7_target_presentation_dev_v1_report.py
          demo_dir="$(mktemp -d)"
          cargo run --quiet --locked -p reasoning-harness-cli \
            --bin reason-source-review-local -- demo --output "$demo_dir/demo.json"
          cargo run --quiet --locked -p reasoning-harness-cli \
            --bin reason-source-review-local -- show-targets \
            --artifact "$demo_dir/demo.json" --target demo-target --json > "$demo_dir/result.json"
          python3 -c 'import json,sys; v=json.load(open(sys.argv[1])); assert v["contract_id"]=="harness-source-reconciliation-target-answer-v1"; assert v["original"]["status"]=="conflict"; assert v["target_answers"][0]["status"]=="conflict"; assert len(v["target_answers"][0]["original"]["citations"])==2' "$demo_dir/result.json"
      - name: Verify frozen Engine 0.7 local reviewer development controls
        run: |
          set -euo pipefail
          git fetch --force origin refs/tags/engine-0.7-reviewer-host-dev-v1-spec-freeze:refs/tags/engine-0.7-reviewer-host-dev-v1-spec-freeze
          test "$(git rev-parse 'engine-0.7-reviewer-host-dev-v1-spec-freeze^{commit}')" = 'fa87aac3c6fc602c2874b604f6e027a4d093784a'
          cmp fixtures/engine-0.7-reviewer-host-development-v1/manifest.json \
            <(git show engine-0.7-reviewer-host-dev-v1-spec-freeze:fixtures/engine-0.7-reviewer-host-development-v1/manifest.json)
          cmp fixtures/engine-0.7-reviewer-host-development-v1/manifest.sha256 \
            <(git show engine-0.7-reviewer-host-dev-v1-spec-freeze:fixtures/engine-0.7-reviewer-host-development-v1/manifest.sha256)
          cargo test --locked -p reasoning-harness-cli --bin reason-source-review-local -- \
            --test-threads=1 --nocapture > /tmp/engine-0.7-reviewer-host-v1.log 2>&1
          python3 scripts/engine-0.7-reviewer-host-dev-v1-report.py \
            --log /tmp/engine-0.7-reviewer-host-v1.log --output /tmp/engine-0.7-reviewer-host-v1-result.json
          cmp evaluation/engine-0.7-reviewer-host-dev-v1-result.json /tmp/engine-0.7-reviewer-host-v1-result.json
          python3 -m unittest -v scripts/test_engine_0_7_reviewer_host_dev_v1_report.py
          reviewer_demo_dir="$(mktemp -d)"
          cargo run --quiet --locked -p reasoning-harness-cli \
            --bin reason-source-review-local -- demo \
            --output "$reviewer_demo_dir/demo.json"
          test "$(stat -c '%a' "$reviewer_demo_dir/demo.json")" = "600"
          cargo run --quiet --locked -p reasoning-harness-cli \
            --bin reason-source-review-local -- inspect \
            --artifact "$reviewer_demo_dir/demo.json" \
            --target demo-target --first-claim demo-claim-0 \
            --second-claim demo-claim-1 \
            > "$reviewer_demo_dir/preview.txt"
          grep -F "READ-ONLY PREVIEW: not an approval" "$reviewer_demo_dir/preview.txt"
          grep -F "Snapshot SHA-256:" "$reviewer_demo_dir/preview.txt"
          if echo piped | cargo run --quiet --locked -p reasoning-harness-cli \
            --bin reason-source-review-local -- enroll --reviewer ci-headless-deny \
            > /tmp/engine-0.7-reviewer-headless-denial.log 2>&1; then
            echo 'ERROR: headless review enrollment unexpectedly succeeded'
            exit 1
          fi
          grep -F 'local interactive terminal required' /tmp/engine-0.7-reviewer-headless-denial.log
      - name: Test non-provider workspace
        run: cargo test --locked --workspace --exclude reasoning-harness-providers
      - name: Test provider package with isolated subprocess fixtures
        run: cargo test --locked -p reasoning-harness-providers -- --test-threads=1
      - name: Validate cross-model concurrency policy
        run: python3 scripts/validate_cross_model_concurrency_policy.py
      - name: Validate Google canonical pacing policy
        run: |
          python3 scripts/validate_google_canonical_pacing.py
          python3 -m unittest -v scripts/test_validate_google_canonical_pacing.py
      - name: Validate frozen v36 raw safety supplement
        run: |
          git fetch --force origin refs/tags/natural-language-e2e-v36-freeze:refs/tags/natural-language-e2e-v36-freeze
          python3 scripts/validate_v36_raw_safety_surface.py
      - name: Validate operational-only retry, paired evidence, and Issue #248 fresh evaluator
        run: |
          python3 -m unittest -v \
            scripts/test_operational_case_retry.py \
            scripts/test_paired_canonical_observation.py \
            scripts/test_issue_248_finalization_e2e_v1.py \
            scripts/test_issue_248_finalization_e2e_v2.py
          python3 scripts/issue_248_finalization_e2e_v1.py --validate-only >/tmp/issue248-finalization-e2e-v1-preflight.json
          python3 scripts/issue_248_finalization_e2e_v2.py --validate-only >/tmp/issue248-finalization-e2e-v2-preflight.json
      - name: CLI smoke
        run: |
          cargo run -q --locked -p reasoning-harness-cli -- run --input examples/input.json --candidate examples/candidate.json --no-config --format json >/tmp/reason-run.json
          jq -e '.schema_version == "reason-cli-output-v1" and .command == "run" and .contracts.artifact == "reasoning-artifact-v1"' /tmp/reason-run.json >/dev/null
          cargo run -q --locked -p reasoning-harness-cli -- run --input examples/input.json --candidate examples/candidate.json --receipts examples/receipts.json --no-config --format json >/tmp/reason-run-receipts.json
          cat examples/input.json | cargo run -q --locked -p reasoning-harness-cli -- run --input - --candidate examples/candidate.json --no-config --format json >/tmp/reason-run-stdin.json
          jq -e '.command == "run" and .result.outcome.verdict != null' /tmp/reason-run-stdin.json >/dev/null
          cargo run -q --locked -p reasoning-harness-cli -- verify examples/artifact.json --format json >/tmp/reason-verify.json
          jq -e '.schema_version == "reason-cli-output-v1" and .command == "verify" and .result.valid == true' /tmp/reason-verify.json >/dev/null
          cat examples/artifact.json | cargo run -q --locked -p reasoning-harness-cli -- verify - --format json >/tmp/reason-verify-stdin.json
          cargo run -q --locked -p reasoning-harness-cli -- schema artifact >/tmp/reason-artifact-schema.json
          jq -e '.command == "schema" and .result.contract_id == "reasoning-artifact-v1" and .result.schema != null' /tmp/reason-artifact-schema.json >/dev/null
          cargo run -q --locked -p reasoning-harness-cli -- schema config >/tmp/reason-config-schema.json
          jq -e '.result.contract_id == "reason-config-v1" and .result.schema != null' /tmp/reason-config-schema.json >/dev/null
          cargo run -q --locked -p reasoning-harness-cli -- run --input examples/input.json --candidate examples/candidate.json --config examples/reason-config.json >/tmp/reason-config-run.json
          jq -e '.command == "run" and .contracts.config == "reason-config-v1" and .result.configuration.config_sources == ["explicit"]' /tmp/reason-config-run.json >/dev/null
          cargo run -q --locked -p reasoning-harness-cli -- eval examples/artifact.json --format json >/tmp/reason-eval.json
      - name: External resolution acceptance
        run: |
          cargo run -q --locked -p reasoning-harness-cli --bin reason-external-resolution-acceptance -- >/tmp/reason-external-acceptance.json
          jq -e '.schema_version == "reason-external-resolution-acceptance-v1" and .frozen_research_inputs_used == false and .aggregate.acceptance_passed == true and .aggregate.unsupported_grounded_claims == 0 and .aggregate.missed_target_insufficiency == 0 and .aggregate.verified_recoveries >= 1' /tmp/reason-external-acceptance.json >/dev/null
      - name: Fixture regression
        run: cargo run -q --locked -p reasoning-harness-cli -- eval fixtures --format json >/tmp/reason-fixtures.json
