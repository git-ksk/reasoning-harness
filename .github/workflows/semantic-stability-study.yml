name: semantic-stability-study

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider for the calibration-only R3 stability study
        required: true
        type: choice
        options:
          - google
          - mistral
        default: google
      model:
        description: Provider model identifier
        required: true
        type: string
        default: gemini-3.5-flash-lite
      fixture_set:
        description: Calibration-only fixture selection
        required: true
        type: choice
        options:
          - causal-triad
          - all-calibration
        default: causal-triad
      trials:
        description: Seed trials per R2 representation
        required: true
        type: choice
        options:
          - '1'
          - '5'
        default: '1'
      max_tokens:
        description: Maximum output tokens per provider call
        required: true
        type: choice
        options:
          - '256'
          - '512'
        default: '512'

permissions:
  contents: read

jobs:
  study:
    name: ${{ inputs.provider }}-${{ inputs.fixture_set }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: reasoning-harness-stability-${{ inputs.provider }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Check provider credential availability
        id: credential
        env:
          PROVIDER: ${{ inputs.provider }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          case "$PROVIDER" in
            mistral) KEY="$MISTRAL_API_KEY" ;;
            google) KEY="$GEMINI_API_KEY" ;;
            *) echo "unsupported provider: $PROVIDER" >&2; exit 2 ;;
          esac
          if [ -n "$KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::credential for $PROVIDER is not configured; skipping stability study."
          fi
      - name: Run bounded calibration-only stability study
        if: steps.credential.outputs.available == 'true'
        env:
          PROVIDER: ${{ inputs.provider }}
          MODEL: ${{ inputs.model }}
          FIXTURE_SET: ${{ inputs.fixture_set }}
          TRIALS: ${{ inputs.trials }}
          MAX_TOKENS: ${{ inputs.max_tokens }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          OUTPUT=/tmp/reason-semantic-stability-study.json
          FIXTURE_ARGS=()
          case "$FIXTURE_SET" in
            causal-triad)
              FIXTURE_ARGS+=(--fixture 07_causal_positive)
              FIXTURE_ARGS+=(--fixture 08_causal_negative)
              FIXTURE_ARGS+=(--fixture 09_causal_ambiguous)
              ;;
            all-calibration) ;;
            *) echo "unsupported calibration fixture set: $FIXTURE_SET" >&2; exit 2 ;;
          esac
          cargo run -q --locked -p reasoning-harness-cli --bin reason-stability-study -- \
            fixtures/semantic-judges \
            --provider "$PROVIDER" \
            --model "$MODEL" \
            --seed 3000 \
            --trials "$TRIALS" \
            --max-tokens "$MAX_TOKENS" \
            "${FIXTURE_ARGS[@]}" \
            > "$OUTPUT"
          jq '{configuration_id, execution_design, materialization_contract, provider, model, fixture_count, representations: [.representations[] | {representation, attempted_runs, successful_runs, failed_runs, protocol_completion_rate, total_tokens, total_latency_ms, mean_latency_ms, trials}], combined_stability: {expected_probes_per_fixture: .combined_stability.expected_probes_per_fixture, policies: .combined_stability.policies, risky_fixtures: [.combined_stability.fixtures[] | select(.assessment.risk_signals | length > 0) | {fixture_id, label, assessment, disagreement_only, complete_unanimity}]}, failures: [.representations[] as $r | $r.cases[] | select(.failure_class != null) | {representation: $r.representation, fixture_id, trial, seed, finish_reason, failure_class, latency_ms, usage}]}' "$OUTPUT"
      - name: Preserve stability-study JSON
        if: always() && steps.credential.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: semantic-stability-${{ inputs.provider }}-${{ inputs.fixture_set }}
          path: /tmp/reason-semantic-stability-study.json
          if-no-files-found: ignore
          retention-days: 14
