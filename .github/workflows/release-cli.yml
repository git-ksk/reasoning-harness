name: release-cli

on:
  push:
    tags:
      - 'reason-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Reason CLI tag to package (`reason-v*`; historical unified `v0.1.0`-`v0.4.2` accepted)
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      engine_version: ${{ steps.meta.outputs.engine_version }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - id: meta
        name: Verify release tag matches CLI version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          META="$(cargo metadata --locked --no-deps --format-version 1)"
          VERSION="$(printf '%s' "$META" | python -c 'import json,sys; data=json.load(sys.stdin); print(next(p["version"] for p in data["packages"] if p["name"]=="reasoning-harness-cli"))')"
          ENGINE_VERSION="$(printf '%s' "$META" | python -c 'import json,sys; data=json.load(sys.stdin); print(next(p["version"] for p in data["packages"] if p["name"]=="reasoning-harness-core"))')"
          case "$TAG" in
            reason-v*)
              BASE_VERSION="${VERSION%%-*}"
              IFS=. read -r VERSION_MAJOR VERSION_MINOR VERSION_PATCH <<< "$BASE_VERSION"
              if (( VERSION_MAJOR == 0 && VERSION_MINOR < 5 )); then
                echo "reason-v* namespace starts at Reason CLI 0.5.0; use the immutable historical v* tag for older releases" >&2
                exit 1
              fi
              EXPECTED_TAG="reason-v$VERSION"
              ;;
            v0.1.0|v0.2.0|v0.3.0|v0.4.0|v0.4.1|v0.4.2) EXPECTED_TAG="v$VERSION" ;;
            *) echo "unsupported CLI tag namespace: $TAG (use reason-vX.Y.Z; historical unified v0.1.0-v0.4.2 are manual-only)" >&2; exit 1 ;;
          esac
          [[ "$TAG" == "$EXPECTED_TAG" ]] || { echo "tag $TAG does not match reasoning-harness-cli version $VERSION" >&2; exit 1; }
          git fetch origin main
          TAG_COMMIT="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$TAG_COMMIT" origin/main || { echo "tag $TAG is not reachable from main" >&2; exit 1; }
          if [[ "$TAG" == reason-v* ]] && GH_TOKEN="${{ github.token }}" gh release view "$TAG" >/dev/null 2>&1; then
            echo "split release $TAG already exists and is immutable; refusing republish" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "engine_version=$ENGINE_VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$TAG_COMMIT" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: linux-x86_64
            executable: target/release/reason
            archive: tar.gz
          - os: macos-15
            asset: macos-aarch64
            executable: target/release/reason
            archive: tar.gz
          - os: macos-15-intel
            asset: macos-x86_64
            executable: target/release/reason
            archive: tar.gz
          - os: windows-2025
            asset: windows-x86_64
            executable: target/release/reason.exe
            archive: zip
    runs-on: ${{ matrix.os }}
    name: package (${{ matrix.asset }})
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --locked --release -p reasoning-harness-cli --bin reason
      - name: Smoke release binary
        shell: bash
        run: |
          set -euo pipefail
          "${{ matrix.executable }}" --version
          "${{ matrix.executable }}" schema artifact > reason-schema.json
          "${{ matrix.executable }}" schema semantic-check > reason-semantic-schema.json
          python - <<'PY'
          import json
          with open('reason-schema.json', encoding='utf-8') as f:
              data = json.load(f)
          with open('reason-semantic-schema.json', encoding='utf-8') as f:
              semantic = json.load(f)
          assert data['result']['contract_id'] == 'reasoning-artifact-v1'
          assert semantic['result']['contract_id'] == 'semantic-check-input-v1'
          PY
      - name: Package Unix release
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          NAME="reason-v${{ needs.prepare.outputs.version }}-${{ matrix.asset }}"
          mkdir "$NAME"
          cp "${{ matrix.executable }}" "$NAME/reason"
          cp README.md LICENSE CHANGELOG.md "$NAME/"
          tar -czf "$NAME.tar.gz" "$NAME"
      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "reason-v${{ needs.prepare.outputs.version }}-${{ matrix.asset }}"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item "${{ matrix.executable }}" "$name/reason.exe"
          Copy-Item README.md, LICENSE, CHANGELOG.md $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - name: Attest packaged native archive
        if: startsWith(needs.prepare.outputs.tag, 'reason-v')
        uses: actions/attest@v4
        with:
          subject-path: reason-v${{ needs.prepare.outputs.version }}-${{ matrix.asset }}.${{ matrix.archive }}
      - uses: actions/upload-artifact@v7
        with:
          name: reason-v${{ needs.prepare.outputs.version }}-${{ matrix.asset }}
          path: reason-v${{ needs.prepare.outputs.version }}-${{ matrix.asset }}.*
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          pattern: reason-v${{ needs.prepare.outputs.version }}-*
          path: dist
          merge-multiple: true
      - name: Add native installer entrypoints for split CLI releases
        shell: bash
        run: |
          set -euo pipefail
          case "${{ needs.prepare.outputs.tag }}" in
            reason-v*)
              python3 scripts/test_installer_contract.py
              cp install.sh install.ps1 dist/
              ;;
            *) echo "historical unified release: installer entrypoints did not exist at this tag" ;;
          esac
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum reason-* > SHA256SUMS
          cat SHA256SUMS
      - name: Generate signed release manifest
        if: startsWith(needs.prepare.outputs.tag, 'reason-v')
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_release_manifest.py \
            --dist dist \
            --tag "${{ needs.prepare.outputs.tag }}" \
            --cli-version "${{ needs.prepare.outputs.version }}" \
            --engine-version "${{ needs.prepare.outputs.engine_version }}" \
            --commit "${{ needs.prepare.outputs.commit }}" \
            --output dist/release-manifest.json
          python3 scripts/test_release_provenance_contract.py
      - name: Attest release metadata and installer entrypoints
        if: startsWith(needs.prepare.outputs.tag, 'reason-v')
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/SHA256SUMS
            dist/release-manifest.json
            dist/install.sh
            dist/install.ps1
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          case "${{ needs.prepare.outputs.tag }}" in
            reason-v*)
              PRERELEASE_ARGS=()
              if [[ "${{ needs.prepare.outputs.version }}" == 0.* ]]; then
                PRERELEASE_ARGS+=(--prerelease)
              fi
              gh release create "${{ needs.prepare.outputs.tag }}" dist/* --verify-tag --generate-notes --title "Reason CLI v${{ needs.prepare.outputs.version }}" "${PRERELEASE_ARGS[@]}"
              ;;
            *)
              gh release view "${{ needs.prepare.outputs.tag }}" >/dev/null 2>&1 && \
                gh release upload "${{ needs.prepare.outputs.tag }}" dist/* --clobber || \
                gh release create "${{ needs.prepare.outputs.tag }}" dist/* --verify-tag --generate-notes --title "Reason CLI v${{ needs.prepare.outputs.version }}"
              ;;
          esac
