name: semantic-decidability-d2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  study:
    name: ${{ matrix.provider }}-${{ matrix.model }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: google
            model: gemini-3.5-flash-lite
          - provider: mistral
            model: ministral-8b-latest
    concurrency:
      group: reasoning-harness-decidability-d2-${{ matrix.provider }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Check frozen provider credential availability
        id: credential
        env:
          PROVIDER: ${{ matrix.provider }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          case "$PROVIDER" in
            mistral) KEY="$MISTRAL_API_KEY" ;;
            google) KEY="$GEMINI_API_KEY" ;;
            *) echo "unsupported frozen provider: $PROVIDER" >&2; exit 2 ;;
          esac
          if [ -z "$KEY" ]; then
            echo "frozen D2 credential is unavailable for $PROVIDER" >&2
            exit 1
          fi
      - name: Run frozen D2 v1 calibration
        env:
          PROVIDER: ${{ matrix.provider }}
          MODEL: ${{ matrix.model }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          OUTPUT=/tmp/reason-semantic-decidability-d2.json
          cargo run -q --locked -p reasoning-harness-cli --bin reason-decidability-study -- \
            fixtures/semantic-decidability-d2 \
            --provider "$PROVIDER" \
            --model "$MODEL" \
            --seed 6000 \
            --trials 5 \
            --max-tokens 512 \
            > "$OUTPUT"
          jq '{configuration_id, semantic_baseline, materialization_contract, decidability_contract, execution_design, provider, model, fixture_count, variant_count, attempted_provider_calls, successful_provider_calls, failed_provider_calls, protocol_completion_rate, total_tokens, total_latency_ms, mean_latency_ms, trials, aggregate, risky_stability: [.stability[] | select(.base_decision_stability.risk_signals | length > 0)], failures: [.cases[] | select(.failure_class != null) | {fixture_id, source_fixture_id, semantic_label, trial, seed, finish_reason, failure_class}]}' "$OUTPUT"
      - name: Preserve frozen D2 JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semantic-decidability-d2-${{ matrix.provider }}-${{ matrix.model }}
          path: /tmp/reason-semantic-decidability-d2.json
          if-no-files-found: error
          retention-days: 30
