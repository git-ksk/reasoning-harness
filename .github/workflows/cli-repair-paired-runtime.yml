name: cli-repair-paired-runtime

on:
  workflow_dispatch:
    inputs:
      check_provider_readiness:
        description: Read-only metadata GET after independent exact-runtime PASS
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: cli-repair-paired-runtime
  cancel-in-progress: false

jobs:
  offline-runtime:
    if: inputs.check_provider_readiness != true
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify pinned Git objects and prepare isolated runtime sources
        run: |
          set -euo pipefail
          git cat-file -e 6165de77c1544a7fe58fc1e675e7cb3a8ec7cc98^{commit}
          git cat-file -e 73bbd18173b4dfcd6664a26241de0385f2eb2e3e^{commit}
          git cat-file -e 4abee90f0501f0d8fc09b453a0b45c942fbed69e^{commit}
          git cat-file -e ab3c6322921c8c738ec35bd018345917b5afa538^{commit}
          python3 evaluation/cli-repair-paired-v1/prepare.py --repo . --output target/paired-runtime
          mkdir -p target/paired-build target/paired-context target/paired-controls target/paired-artifact
      - name: Build both patched Engine hosts with identical instrumentation
        run: |
          set -euo pipefail
          stage=target/paired-runtime/repo/evaluation/cli-repair-paired-v1
          docker build -f "$stage/Dockerfile.build" -t paired-builder "$stage"
          docker run --rm --cpus 2 --memory 4g -v "$PWD:/repo:ro" -v "$PWD/target/paired-runtime/repo:/prepared:ro" -v "$PWD/target/paired-build:/work" paired-builder python3 /prepared/evaluation/cli-repair-paired-v1/build.py --repo /repo --work-dir /work/build --fetch-dependencies
          python3 "$stage/assemble_image.py" --repo target/paired-runtime/repo --bin-dir target/paired-build/build/bin --context target/paired-context
          docker build -f "$stage/Dockerfile.runtime" -t paired-runtime target/paired-context
      - name: Verify actual CLI and provider paths without external networking
        run: |
          set -euo pipefail
          docker run --rm --read-only --network none --tmpfs /tmp paired-runtime python3 -B /repo/evaluation/cli-repair-paired-v1/image_inventory.py > target/paired-controls/image-inventory.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          actual=json.loads(Path('target/paired-controls/image-inventory.json').read_bytes())
          prepared=json.loads(Path('target/paired-runtime/preparation.json').read_bytes())
          assert actual['runtime_files']==prepared['files']
          PY
          docker run --rm --read-only --network none --tmpfs /tmp paired-runtime python3 -B -m unittest discover -s /repo/evaluation/cli-repair-paired-v1 -p 'test_*.py' > target/paired-controls/unit.log 2>&1
          docker run --rm --read-only --network none --tmpfs /tmp -v "$PWD/target/paired-controls:/output" paired-runtime python3 -B /repo/evaluation/cli-repair-paired-v1/preflight.py --bin-dir /eval/bin --output /output/provider
          docker run --rm --read-only --network none --tmpfs /tmp -v "$PWD/target/paired-controls:/output" paired-runtime python3 -B /repo/evaluation/cli-repair-paired-v1/preflight_cli.py --bin-dir /eval/bin --output /output/cli
          docker run --rm --read-only --network none --tmpfs /tmp -v "$PWD/target/paired-controls:/output" paired-runtime python3 -B /repo/evaluation/cli-repair-paired-v1/verify_containment.py --output /output/containment
          docker run --rm -i --read-only --network none --tmpfs /tmp -e PYTHONPATH=/repo/evaluation/cli-repair-paired-v1 -v "$PWD/target/paired-controls:/output" paired-runtime python3 -B - --corpus /output/cli/baseline-google-acquisition/corpus.json --output /output/registry-parity.json < evaluation/cli-repair-paired-v1/verify_registry_parity.py
      - name: Archive exact image and offline identity without granting execution
        run: |
          set -euo pipefail
          docker save paired-runtime | gzip > target/paired-artifact/runtime-image.tar.gz
          image_id=$(docker image inspect paired-runtime --format '{{.Id}}')
          python3 evaluation/cli-repair-paired-v1/runtime_proof.py --repo . --prepared target/paired-runtime --bin-dir target/paired-build/build/bin --controls target/paired-controls --image-id "$image_id" --image-archive target/paired-artifact/runtime-image.tar.gz --output target/paired-artifact/runtime-proof.json
          cp target/paired-build/build/bin/identity.json target/paired-artifact/identity.json
          cp target/paired-runtime/preparation.json target/paired-artifact/preparation.json
          sudo tar -czf target/paired-artifact/offline-controls.tar.gz -C target/paired-controls .
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cli-paired-runtime-${{ github.sha }}
          path: |
            target/paired-artifact/
            target/paired-controls/unit.log
          if-no-files-found: error
          retention-days: 14

  provider-metadata-readiness:
    if: inputs.check_provider_readiness == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        provider: [mistral, google]
    concurrency:
      group: ${{ matrix.provider == 'mistral' && 'reasoning-harness-mistral-live' || 'engine07-realworld-google-live' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Load independently reviewed runtime before credentials
        env:
          GH_TOKEN: ${{ github.token }}
          EVALUATION_PROVIDER: ${{ matrix.provider }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/readiness /tmp/runtime /tmp/review
          python3 - <<'PY'
          import hashlib,json,os,shutil,subprocess
          from pathlib import Path
          source=Path('evaluation/cli-repair-paired-real24-development-v1')
          reference=json.loads((source/'runtime-reference.json').read_bytes())
          review=source/'development-review/review.json'
          assert hashlib.sha256(review.read_bytes()).hexdigest()==reference['operational_review_sha256']
          shutil.copyfile(review,'/tmp/review/review.json')
          with open('/tmp/runtime.zip','wb') as stream:
              subprocess.run(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/artifacts/{reference["runtime_artifact_id"]}/zip'],stdout=stream,check=True)
          PY
          unzip -q /tmp/runtime.zip -d /tmp/runtime
          artifact_root=$(dirname "$(find /tmp/runtime -name runtime-proof.json -print -quit)")
          docker load -i "$artifact_root/runtime-image.tar.gz"
          cp "$artifact_root/runtime-proof.json" /tmp/review/runtime-proof.json
          python3 - "$artifact_root/runtime-image.tar.gz" <<'PY'
          import hashlib,json,subprocess,sys
          from pathlib import Path
          proof=json.loads(Path('/tmp/review/runtime-proof.json').read_bytes())
          actual=subprocess.check_output(['docker','image','inspect','paired-runtime','--format','{{.Id}}']).decode().strip()
          assert actual==proof['runtime_image_id']
          assert hashlib.file_digest(open(sys.argv[1],'rb'),'sha256').hexdigest()==proof['runtime_image_archive_sha256']
          PY
          docker run --rm --read-only --network none --tmpfs /tmp -v /tmp/review:/review:ro paired-runtime python3 -B /repo/evaluation/cli-repair-paired-v1/provider_readiness.py --provider "$EVALUATION_PROVIDER" --review /review/review.json --runtime-proof /review/runtime-proof.json --verify-only
      - name: Single metadata GET with no generation or retry
        env:
          MISTRAL_API_KEY: ${{ matrix.provider == 'mistral' && secrets.MISTRAL_API_KEY || '' }}
          GEMINI_API_KEY: ${{ matrix.provider == 'google' && secrets.GEMINI_API_KEY || '' }}
          EVALUATION_PROVIDER: ${{ matrix.provider }}
        run: |
          set -euo pipefail
          name=cli-paired-metadata-$EVALUATION_PROVIDER-$GITHUB_RUN_ID
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT INT TERM
          timeout --signal=INT --kill-after=5s 60s docker run --name "$name" --rm --read-only --tmpfs /tmp -v /tmp/review:/review:ro -v /tmp/readiness:/output -e MISTRAL_API_KEY -e GEMINI_API_KEY paired-runtime python3 -B /repo/evaluation/cli-repair-paired-v1/provider_readiness.py --provider "$EVALUATION_PROVIDER" --review /review/review.json --runtime-proof /review/runtime-proof.json --output /output/readiness.json
      - name: Stop metadata container before collection
        if: always()
        run: docker rm -f cli-paired-metadata-${{ matrix.provider }}-${{ github.run_id }} >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cli-paired-readiness-${{ matrix.provider }}-${{ github.run_id }}
          path: /tmp/readiness/
          if-no-files-found: error
          retention-days: 14
