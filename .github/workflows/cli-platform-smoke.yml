name: cli-platform-smoke

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  product-cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux-x86_64
          - os: macos-15
            label: macos-aarch64
          - os: macos-15-intel
            label: macos-x86_64
          - os: windows-2025
            label: windows-x86_64
    runs-on: ${{ matrix.os }}
    name: reason (${{ matrix.label }})
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Build supported CLI and MCP adapter
        run: cargo build --locked -p reasoning-harness-cli --bin reason --bin reason-mcp
      - name: Subprocess environment isolation baseline
        env:
          REASON_SUBPROCESS_SENTINEL_SECRET: ci-sentinel-must-not-leak
        run: >-
          cargo test --locked -p reasoning-harness-providers
          subprocess_environment::tests::child_environment_strips_ambient_sentinel_and_preserves_launch_baseline
          -- --exact --nocapture
      - name: External acquisition subprocess lanes do not inherit ambient secrets
        if: runner.os != 'Windows'
        env:
          REASON_SUBPROCESS_SENTINEL_SECRET: ci-sentinel-must-not-leak
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p reasoning-harness-providers \
            external_command::tests::command_adapter_exchanges_typed_stdio_without_trust_promotion \
            -- --exact --nocapture
          cargo test --locked -p reasoning-harness-providers \
            mcp_readonly_v2::tests::modern_stdio_call_carries_protocol_and_stable_provenance \
            -- --exact --nocapture
          cargo test --locked -p reasoning-harness-providers \
            mcp_readonly_v3::tests::negotiated_session_accepts_allowlisted_downgrade_and_keeps_generic_content_opaque \
            -- --exact --nocapture
          cargo test --locked -p reasoning-harness-providers \
            trusted_command::tests::verifier_constructs_exact_receipt_in_harness_not_from_external_fields \
            -- --exact --nocapture
      - name: Product CLI compatibility contract
        run: cargo test --locked -p reasoning-harness-cli --test product_cli_contract
      - name: MCP product-surface contract
        run: cargo test --locked -p reasoning-harness-cli --test mcp_product_surface
      - name: Product CLI smoke
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Windows) REASON_BIN="target/debug/reason.exe" ;;
            *) REASON_BIN="target/debug/reason" ;;
          esac
          "$REASON_BIN" --version
          "$REASON_BIN" run --input examples/input.json --candidate examples/candidate.json --no-config --format json > reason-run.json
          "$REASON_BIN" verify examples/artifact.json --format json > reason-verify.json
          "$REASON_BIN" schema artifact > reason-schema.json
          "$REASON_BIN" schema semantic-check > reason-semantic-schema.json
          "$REASON_BIN" semantic-check --help > reason-semantic-help.txt
          set +e
          printf '{}' | "$REASON_BIN" run --input - --candidate examples/candidate.json --no-config --format json > reason-run-error.json 2> reason-run-error.stderr
          ERROR_STATUS=$?
          set -e
          test "$ERROR_STATUS" -eq 1
          test ! -s reason-run-error.stderr
          python - <<'PY'
          import json
          with open('reason-run.json', encoding='utf-8') as f:
              run = json.load(f)
          with open('reason-verify.json', encoding='utf-8') as f:
              verify = json.load(f)
          with open('reason-schema.json', encoding='utf-8') as f:
              schema = json.load(f)
          with open('reason-semantic-schema.json', encoding='utf-8') as f:
              semantic_schema = json.load(f)
          with open('reason-run-error.json', encoding='utf-8') as f:
              run_error = json.load(f)
          assert run['schema_version'] == 'reason-cli-output-v1'
          assert run['command'] == 'run'
          assert run['result']['outcome']['verdict'] in {'accept', 'reject', 'unknown'}
          assert verify['command'] == 'verify' and verify['result']['valid'] is True
          assert schema['command'] == 'schema'
          assert schema['result']['contract_id'] == 'reasoning-artifact-v1'
          assert semantic_schema['result']['contract_id'] == 'semantic-check-input-v1'
          assert run_error['command'] == 'run'
          assert run_error['result']['status'] == 'failed'
          assert run_error['result']['failure']['failure_class'] == 'input'
          PY
