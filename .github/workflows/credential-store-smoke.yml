name: credential-store-smoke

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/reasoning-harness-cli/**'
      - 'crates/reasoning-harness-providers/**'
      - '.github/workflows/credential-store-smoke.yml'
      - 'scripts/test_auth_cli_lifecycle.py'
      - 'scripts/test_setup_cli_lifecycle.py'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/reasoning-harness-cli/**'
      - 'crates/reasoning-harness-providers/**'
      - '.github/workflows/credential-store-smoke.yml'
      - 'scripts/test_auth_cli_lifecycle.py'
      - 'scripts/test_setup_cli_lifecycle.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-store:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Native credential-store round trip
        run: >-
          cargo test --locked -p reasoning-harness-cli --bin reason
          secure_credentials::tests::native_os_store_round_trip
          -- --ignored --exact --nocapture
      - name: Auth CLI credential lifecycle
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p reasoning-harness-cli --bin reason
          python scripts/test_auth_cli_lifecycle.py
          python scripts/test_setup_cli_lifecycle.py

  linux-secret-service:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install isolated Secret Service
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dbus-x11 gnome-keyring
      - name: Secret Service round trip
        shell: bash
        run: |
          set -euo pipefail
          dbus-run-session -- bash -euo pipefail -c '
            eval "$(printf "\n" | gnome-keyring-daemon --unlock --components=secrets)"
            cargo test --locked -p reasoning-harness-cli --bin reason \
              secure_credentials::tests::native_os_store_round_trip \
              -- --ignored --exact --nocapture
            cargo build --locked -p reasoning-harness-cli --bin reason
            python scripts/test_auth_cli_lifecycle.py
          python scripts/test_setup_cli_lifecycle.py
          '

  linux-headless:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Missing Secret Service fails closed
        shell: bash
        run: |
          set -euo pipefail
          DBUS_SESSION_BUS_ADDRESS="unix:path=${RUNNER_TEMP}/reason-no-secret-service" \
          XDG_RUNTIME_DIR="${RUNNER_TEMP}/reason-no-runtime" \
            cargo test --locked -p reasoning-harness-cli --bin reason \
              secure_credentials::tests::headless_linux_store_failure_is_typed_and_never_plaintext \
              -- --ignored --exact --nocapture
