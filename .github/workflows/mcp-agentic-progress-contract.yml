name: mcp-agentic-progress-contract

on:
  push:
    branches:
      - experiment/mcp-knowledge-probe
    paths:
      - scripts/assert_target_directed_progress_contract.py
      - scripts/assert_transport_retry_accounting.py
      - scripts/knowledge_search_agentic_wrapper.py
      - scripts/knowledge_search_fused_mcp.py
      - .github/workflows/mcp-agentic-progress-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Assert target-directed no-progress contract
        run: |
          set -euo pipefail
          python3 scripts/assert_target_directed_progress_contract.py
      - name: Assert transport retry/request accounting contract
        run: |
          set -euo pipefail
          python3 scripts/assert_transport_retry_accounting.py
