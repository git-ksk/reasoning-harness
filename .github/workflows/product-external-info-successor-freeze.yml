name: product-external-info-successor-freeze

on:
  pull_request:
    paths:
      - 'fixtures/product-external-info-v2/**'
      - 'fixtures/product-external-info-v2.sha256'
      - 'fixtures/product-external-info-v1/**'
      - 'fixtures/product-external-info-v1.sha256'
      - 'fixtures/product-dogfood-v1/**'
      - 'fixtures/product-dogfood-v1.sha256'
      - 'scripts/product_external_info_mcp.py'
      - 'scripts/validate_product_external_info_v2.py'
      - 'crates/reasoning-harness-cli/src/bin/product_external_info_successor.rs'
      - 'crates/reasoning-harness-cli/Cargo.toml'
      - 'crates/reasoning-harness-providers/src/mcp_readonly.rs'
      - '.github/workflows/product-external-info-successor-freeze.yml'
      - '.github/workflows/product-external-info-successor-live.yml'
  push:
    branches:
      - main
      - feat/206-product-external-info-successor
    paths:
      - 'fixtures/product-external-info-v2/**'
      - 'fixtures/product-external-info-v2.sha256'
      - 'fixtures/product-external-info-v1/**'
      - 'fixtures/product-external-info-v1.sha256'
      - 'fixtures/product-dogfood-v1/**'
      - 'fixtures/product-dogfood-v1.sha256'
      - 'scripts/product_external_info_mcp.py'
      - 'scripts/validate_product_external_info_v2.py'
      - 'crates/reasoning-harness-cli/src/bin/product_external_info_successor.rs'
      - 'crates/reasoning-harness-cli/Cargo.toml'
      - 'crates/reasoning-harness-providers/src/mcp_readonly.rs'
      - '.github/workflows/product-external-info-successor-freeze.yml'
      - '.github/workflows/product-external-info-successor-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-successor-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2

      - name: Validate successor freeze contract
        run: |
          set -euo pipefail
          python3 scripts/validate_product_external_info_v2.py | tee /tmp/product-external-info-v2-validation.json
          jq -e '
            .valid == true
            and .live_observation_performed == false
            and .corpus_identity == "product-external-info-v2"
            and .semantic_identity == "verified-target-finalization-successor-v2"
            and .scoring_identity == "product-external-info-scoring-v2"
            and .four_arm_identity == "product-external-info-four-arm-v2"
            and .cases == 21
            and .capability_families == 7
            and .historical_v1_reused == false
            and .legacy_product_dogfood_v1_cases == 6
            and .provider == "mistral"
            and .model == "ministral-8b-latest"
            and .seed == 26000
            and .max_tokens == 1024
          ' /tmp/product-external-info-v2-validation.json >/dev/null
          (cd fixtures/product-external-info-v2 && sha256sum -c ../product-external-info-v2.sha256)
          (cd fixtures/product-external-info-v1 && sha256sum -c ../product-external-info-v1.sha256)
          (cd fixtures/product-dogfood-v1 && sha256sum -c ../product-dogfood-v1.sha256)

      - name: Prove historical freezes and mcp_readonly_v1 semantics are untouched
        run: |
          set -euo pipefail
          git cat-file -e a365a46d5fa948063e9ac745ad14646c23456ede^{commit}
          git diff --exit-code a365a46d5fa948063e9ac745ad14646c23456ede -- \
            fixtures/product-external-info-v1 \
            fixtures/product-external-info-v1.sha256 \
            fixtures/product-dogfood-v1 \
            fixtures/product-dogfood-v1.sha256 \
            crates/reasoning-harness-providers/src/mcp_readonly.rs

      - name: Validate four-arm evaluator wiring
        run: |
          set -euo pipefail
          cargo run -q --locked -p reasoning-harness-cli --bin reason-product-external-info-successor -- \
            --validate-only --seed 26000 --max-tokens 1024 \
            > /tmp/product-external-info-v2-evaluator-validation.json
          jq -e '
            .schema_version == "reason-product-external-info-v2"
            and .comparison_contract == "single-acquisition-four-arm-target-finalization-v2"
            and .corpus_identity == "product-external-info-v2"
            and .seed == 26000
            and .max_tokens == 1024
            and .aggregate.total_cases == 21
            and .aggregate.semantic_cases == 18
            and .aggregate.operational_cases == 3
            and .comparison.raw_model_no_external.semantic_cases_scored == 18
            and .comparison.harness_no_external.semantic_cases_scored == 18
            and .comparison.raw_model_with_external.semantic_cases_scored == 18
            and .comparison.harness_with_mcp_external.semantic_cases_scored == 18
            and .semantic_denominator_excludes_operational_failures == true
          ' /tmp/product-external-info-v2-evaluator-validation.json >/dev/null

      - name: Test unchanged MCP and admission safety boundaries
        run: |
          set -euo pipefail
          cargo test --locked -p reasoning-harness-providers mcp_readonly -- --nocapture
          cargo test --locked -p reasoning-harness-providers external_admission -- --nocapture
          cargo test --locked -p reasoning-harness-core canonical_verified_target -- --nocapture
