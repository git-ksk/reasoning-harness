name: cli-repair-paired-development

on:
  push:
    tags:
      - cli-repair-paired-real24-development-v1

permissions:
  contents: read
  actions: read

jobs:
  real-model-evaluation:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        provider: [mistral, google]
    concurrency:
      group: ${{ matrix.provider == 'mistral' && 'reasoning-harness-mistral-live' || 'engine07-realworld-google-live' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify frozen admission and prepare the exact seen24 input before credentials
        env:
          GH_TOKEN: ${{ github.token }}
          EVALUATION_PROVIDER: ${{ matrix.provider }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/results /tmp/runtime /tmp/frozen
          test "$GITHUB_RUN_ATTEMPT" = 1
          # Workflow-specific history is 404 before its first registered tag push.
          # Tag-filtered repository history is available beforehand and also sees cross-head replays.
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs?event=push&branch=$GITHUB_REF_NAME&per_page=100" > /tmp/results/run-reservation.json
          python3 - <<'PY'
          import hashlib,json,os,shutil,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,'evaluation/cli-repair-paired-v1')
          from tag_admission import single_first_push
          source=Path('evaluation/cli-repair-paired-real24-development-v1')
          receipt=json.loads((source/'receipt.json').read_bytes())
          assert receipt['identity']=='cli-repair-paired-v1-development-freeze-v1' and receipt['state']=='DEVELOPMENT_FROZEN'
          assert receipt['execution_tag']==os.environ['GITHUB_REF_NAME']=='cli-repair-paired-real24-development-v1'
          assert receipt['required_provider_readiness'][os.environ['EVALUATION_PROVIDER']]['new_live_run_allowed'] is True
          assert receipt['execution_workflow_sha256']==hashlib.sha256(Path('.github/workflows/cli-repair-paired-development.yml').read_bytes()).hexdigest()
          tag_gate=Path('evaluation/cli-repair-paired-v1/tag_admission.py')
          assert hashlib.sha256(tag_gate.read_bytes()).hexdigest()==receipt['files']['evaluation/cli-repair-paired-v1/tag_admission.py']
          single_first_push(json.load(open('/tmp/results/run-reservation.json')),
                            os.environ['GITHUB_REF_NAME'],os.environ['GITHUB_SHA'],os.environ['GITHUB_RUN_ID'])
          shutil.copyfile(source/'receipt.json','/tmp/frozen/development.json')
          shutil.copytree(source/'development-review','/tmp/frozen/development-review')
          # Both authenticated metadata GET records are hash-bound before either provider gets credentials.
          shutil.copytree(source/'provider-readiness','/tmp/frozen/provider-readiness')
          artifact=receipt['runtime_artifact_id']
          with open('/tmp/runtime.zip','wb') as stream:
              subprocess.run(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/artifacts/{artifact}/zip'],stdout=stream,check=True)
          PY
          unzip -q /tmp/runtime.zip -d /tmp/runtime
          artifact_root=$(dirname "$(find /tmp/runtime -name runtime-proof.json -print -quit)")
          test -n "$artifact_root"
          docker load -i "$artifact_root/runtime-image.tar.gz"
          image_id=$(docker image inspect paired-runtime --format '{{.Id}}')
          docker run --rm --read-only --network none --tmpfs /tmp -v /tmp/frozen:/frozen:ro -v "$artifact_root:/image:ro" paired-runtime python3 -B /repo/evaluation/cli-repair-paired-v1/verify_development.py --receipt /frozen/development.json --provider "$EVALUATION_PROVIDER" --image-archive /image/runtime-image.tar.gz --actual-image-id "$image_id"
          git archive 6165de77c1544a7fe58fc1e675e7cb3a8ec7cc98 evaluation/engine073-realworld-independent-v1-input | tar -x -C /tmp/frozen
          mv /tmp/frozen/evaluation/engine073-realworld-independent-v1-input /tmp/frozen/corpus
          rm -rf /tmp/frozen/evaluation
          docker run --rm --read-only --tmpfs /tmp -v /tmp/frozen:/frozen paired-runtime python3 -B /repo/evaluation/cli-repair-paired-v1/prepare_consumed_sources.py --corpus-dir /frozen/corpus --M1-sha256 597e1488d07654b07e2a1e528db8b1ae934e438a8edd3f96d31cfc26dd584cd3
          sudo chmod -R a-w /tmp/frozen
          docker run --rm --read-only --network none --tmpfs /tmp -v /tmp/frozen:/frozen:ro -v /tmp/results:/output paired-runtime python3 -B /repo/evaluation/cli-repair-paired-v1/make_development_plan.py --receipt /frozen/development.json --corpus-dir /frozen/corpus --provider "$EVALUATION_PROVIDER" --output /output/plan.json
      - name: Execute the first real-model paired development cohort
        env:
          MISTRAL_API_KEY: ${{ matrix.provider == 'mistral' && secrets.MISTRAL_API_KEY || '' }}
          GEMINI_API_KEY: ${{ matrix.provider == 'google' && secrets.GEMINI_API_KEY || '' }}
          EVALUATION_PROVIDER: ${{ matrix.provider }}
        run: |
          set -euo pipefail
          case "$EVALUATION_PROVIDER" in
            mistral) test -n "$MISTRAL_API_KEY" ;;
            google) test -n "$GEMINI_API_KEY" ;;
          esac
          name=cli-repair-real24-$EVALUATION_PROVIDER-$GITHUB_RUN_ID
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT INT TERM
          timeout --signal=INT --kill-after=5s 340m docker run --name "$name" --read-only --tmpfs /tmp -v /tmp/frozen:/frozen:ro -v /tmp/results:/output -e MISTRAL_API_KEY -e GEMINI_API_KEY paired-runtime python3 -B /repo/evaluation/cli-repair-paired-v1/run_lane.py --plan /output/plan.json --output /output/lane --protocol /repo/evaluation/cli-repair-paired-v1/protocol.json
      - name: Stop the contained process tree before collection
        if: always()
        run: docker rm -f cli-repair-real24-${{ matrix.provider }}-${{ github.run_id }} >/dev/null 2>&1 || true
      - name: Capture actual output and all incomplete rows
        if: always()
        env:
          EVALUATION_PROVIDER: ${{ matrix.provider }}
        run: |
          set -euo pipefail
          docker run --rm --read-only --network none --tmpfs /tmp -v /tmp/frozen:/frozen:ro -v /tmp/results:/output paired-runtime python3 -B /repo/evaluation/cli-repair-paired-v1/collect_checked.py --corpus-dir /frozen/corpus --provider "$EVALUATION_PROVIDER" --lane /output/lane --output /output/observations
      - name: Preserve private raw modes and transfer ownership to the uploader
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" /tmp/results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cli-repair-real24-${{ matrix.provider }}-${{ github.run_id }}
          path: /tmp/results/
          if-no-files-found: error
          retention-days: 30
