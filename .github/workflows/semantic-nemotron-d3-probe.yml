name: semantic-nemotron-d3-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d2:
    name: nemotron-d2-probe
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Check NVIDIA credential availability
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          if [ -z "$NVIDIA_API_KEY" ]; then
            echo "NVIDIA_API_KEY is unavailable" >&2
            exit 1
          fi
      - name: Run frozen Nemotron D2 probe
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          OUTPUT=/tmp/reason-nemotron-d2-probe.json
          cargo run -q --locked -p reasoning-harness-cli --bin reason-decidability-study -- \
            fixtures/semantic-decidability-d2 \
            --provider nvidia \
            --model nvidia/nemotron-3.5-lightning-30b-a3b \
            --seed 6000 \
            --trials 1 \
            --max-tokens 512 \
            > "$OUTPUT"
          jq '{configuration_id, provider, model, attempted_provider_calls, successful_provider_calls, failed_provider_calls, protocol_completion_rate, total_tokens, total_latency_ms, mean_latency_ms, trials, aggregate, risky_stability: [.stability[] | select(.base_decision_stability.risk_signals | length > 0)], failures: [.cases[] | select(.failure_class != null) | {fixture_id, source_fixture_id, semantic_label, trial, seed, finish_reason, failure_class, failure}]}' "$OUTPUT"
      - name: Preserve Nemotron D2 probe JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-nemotron-d2-probe
          path: /tmp/reason-nemotron-d2-probe.json
          if-no-files-found: error
          retention-days: 30

  v5:
    name: nemotron-v5-probe
    needs: d2
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Verify frozen holdout-v5 payloads
        run: sha256sum --check fixtures/semantic-decidability-holdout-v5.sha256
      - name: Check NVIDIA credential availability
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          if [ -z "$NVIDIA_API_KEY" ]; then
            echo "NVIDIA_API_KEY is unavailable" >&2
            exit 1
          fi
      - name: Run frozen Nemotron v5 probe
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          OUTPUT=/tmp/reason-nemotron-v5-probe.json
          cargo run -q --locked -p reasoning-harness-cli --bin reason-decidability-study -- \
            fixtures/semantic-decidability-holdout-v5 \
            --surface holdout-v5 \
            --provider nvidia \
            --model nvidia/nemotron-3.5-lightning-30b-a3b \
            --seed 7000 \
            --trials 1 \
            --max-tokens 512 \
            > "$OUTPUT"
          jq '{configuration_id, study_surface, candidate_id, provider, model, attempted_provider_calls, successful_provider_calls, failed_provider_calls, protocol_completion_rate, total_tokens, total_latency_ms, mean_latency_ms, trials, aggregate, risky_stability: [.stability[] | select(.base_decision_stability.risk_signals | length > 0)], failures: [.cases[] | select(.failure_class != null) | {fixture_id, source_fixture_id, semantic_label, trial, seed, finish_reason, failure_class, failure}]}' "$OUTPUT"
      - name: Preserve Nemotron v5 probe JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-nemotron-v5-probe
          path: /tmp/reason-nemotron-v5-probe.json
          if-no-files-found: error
          retention-days: 30
