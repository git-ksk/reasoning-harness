name: Issue 616 independent holdout author-draft integrity (offline)
on:
  push:
    branches:
      - eval/616-independent-holdout24-author-20261116
    paths:
      - evaluation/engine073-531-independent24-20261116/**
      - .github/workflows/engine073-616-independent-author-draft-offline.yml
  pull_request:
    paths:
      - evaluation/engine073-531-independent24-20261116/**
      - .github/workflows/engine073-616-independent-author-draft-offline.yml
permissions:
  contents: read
jobs:
  public-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Public hashes, no labels, preregistered HOLD gates
        run: env -u MISTRAL_API_KEY -u GROQ_API_KEY -u OPENAI_API_KEY -u GEMINI_API_KEY python3 evaluation/engine073-531-independent24-20261116/validate_independent24.py --repo .
      - name: Offline fail-closed tests (private gold absent)
        run: env -u MISTRAL_API_KEY -u GROQ_API_KEY -u OPENAI_API_KEY -u GEMINI_API_KEY python3 -m unittest discover -s evaluation/engine073-531-independent24-20261116 -p 'test_*.py' -v
