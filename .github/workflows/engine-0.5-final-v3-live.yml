name: engine-0.5-final-v3-live

on:
  push:
    tags:
      - engine-0.5-final-v3-freeze

permissions:
  contents: read
  actions: read

env:
  FREEZE_TAG: engine-0.5-final-v3-freeze
  PRODUCT_COMMIT: d60b9afdf0bb2a0c1986f8c8f7cb47e534a4cd90

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Reject workflow reruns
        run: test "$GITHUB_RUN_ATTEMPT" = "1"
      - uses: actions/checkout@v7
        with:
          ref: engine-0.5-final-v3-freeze
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Revalidate frozen hardening surface before credentials
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$FREEZE_TAG")"
          test "$(git describe --tags --exact-match HEAD)" = "$FREEZE_TAG"
          git diff --exit-code "$PRODUCT_COMMIT" -- Cargo.toml Cargo.lock crates
          sha256sum -c fixtures/engine-0.5-final-v3-surface.sha256
          python3 scripts/engine_0_5_final_v3_finalization.py --validate-only > /tmp/engine050v3-validate.json
          python3 -m unittest -v scripts/test_engine_0_5_final_v3_finalization.py
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Preserve preflight
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: engine-0.5-final-v3-preflight
          path: /tmp/engine050v3-validate.json
          if-no-files-found: warn

  mistral:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - target: mistral-14b
            role: affected_required
          - target: mistral-8b
            role: validated_reference
    env:
      TARGET: ${{ matrix.target }}
      ROLE: ${{ matrix.role }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: engine-0.5-final-v3-freeze
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88.0'
      - uses: Swatinem/rust-cache@v2
      - name: Revalidate surface and build exact product candidate
        run: |
          set -euo pipefail
          git diff --exit-code "$PRODUCT_COMMIT" -- Cargo.toml Cargo.lock crates
          sha256sum -c fixtures/engine-0.5-final-v3-surface.sha256
          python3 scripts/engine_0_5_final_v3_finalization.py --validate-only > /dev/null
          git worktree add --detach /tmp/engine050v3-product "$PRODUCT_COMMIT"
          (cd /tmp/engine050v3-product && CARGO_TARGET_DIR=/tmp/engine050v3-target cargo build --locked -p reasoning-harness-cli --bin reason)
          /tmp/engine050v3-target/debug/reason --version
      - name: Check Mistral credential
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: test -n "$MISTRAL_API_KEY"
      - name: Run first canonical Mistral observation
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          REASON_MISTRAL_RATE_LIMIT_TELEMETRY: '1'
        run: |
          set -u
          printf '%s\n' "{\"schema_version\":\"engine-0.5-final-v3-attempt\",\"target\":\"$TARGET\",\"role\":\"$ROLE\",\"github_run_id\":\"$GITHUB_RUN_ID\",\"github_run_attempt\":\"$GITHUB_RUN_ATTEMPT\"}" > "/tmp/engine050v3-$TARGET-attempt.json"
          set +e
          python3 scripts/engine_0_5_final_v3_finalization.py --reason-bin /tmp/engine050v3-target/debug/reason --target "$TARGET" --output "/tmp/engine050v3-$TARGET-report.json" > "/tmp/engine050v3-$TARGET.stdout.json" 2> "/tmp/engine050v3-$TARGET.stderr.log"
          RC=$?
          set -e
          printf '%s\n' "$RC" > "/tmp/engine050v3-$TARGET.rc"
          if test -f "/tmp/engine050v3-$TARGET-report.json"; then
            jq '{provider_target,provider_policy,aggregate,acceptance_passed,cases:[.cases[]|{id,passed,target_recalled,start_prior_grounded,start_prior_explicit_fact_persisted,harness_materialized_correction_target,harness_materialized_investigation_target,target_grounded,artifact_exact_supported,unsupported_exposed_assertions}]}' "/tmp/engine050v3-$TARGET-report.json"
          fi
          exit 0
      - name: Preserve canonical Mistral evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: engine-0.5-final-v3-${{ matrix.target }}
          path: /tmp/engine050v3-${{ matrix.target }}*
          if-no-files-found: warn

  google:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - target: google-gemini-3.5-flash-lite
            role: validated_reference
          - target: google-gemma-4-31b-it
            role: validated_reference
    env:
      TARGET: ${{ matrix.target }}
      ROLE: ${{ matrix.role }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: engine-0.5-final-v3-freeze
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88.0'
      - uses: Swatinem/rust-cache@v2
      - name: Revalidate surface and build exact product candidate
        run: |
          set -euo pipefail
          git diff --exit-code "$PRODUCT_COMMIT" -- Cargo.toml Cargo.lock crates
          sha256sum -c fixtures/engine-0.5-final-v3-surface.sha256
          python3 scripts/engine_0_5_final_v3_finalization.py --validate-only > /dev/null
          git worktree add --detach /tmp/engine050v3-product "$PRODUCT_COMMIT"
          (cd /tmp/engine050v3-product && CARGO_TARGET_DIR=/tmp/engine050v3-target cargo build --locked -p reasoning-harness-cli --bin reason)
          /tmp/engine050v3-target/debug/reason --version
      - name: Check Google credential
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: test -n "$GEMINI_API_KEY"
      - name: Run first canonical Google observation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REASON_GOOGLE_MIN_REQUEST_INTERVAL_MS: '6000'
        run: |
          set -u
          printf '%s\n' "{\"schema_version\":\"engine-0.5-final-v3-attempt\",\"target\":\"$TARGET\",\"role\":\"$ROLE\",\"github_run_id\":\"$GITHUB_RUN_ID\",\"github_run_attempt\":\"$GITHUB_RUN_ATTEMPT\"}" > "/tmp/engine050v3-$TARGET-attempt.json"
          set +e
          python3 scripts/engine_0_5_final_v3_finalization.py --reason-bin /tmp/engine050v3-target/debug/reason --target "$TARGET" --output "/tmp/engine050v3-$TARGET-report.json" > "/tmp/engine050v3-$TARGET.stdout.json" 2> "/tmp/engine050v3-$TARGET.stderr.log"
          RC=$?
          set -e
          printf '%s\n' "$RC" > "/tmp/engine050v3-$TARGET.rc"
          if test -f "/tmp/engine050v3-$TARGET-report.json"; then
            jq '{provider_target,provider_policy,aggregate,acceptance_passed,cases:[.cases[]|{id,passed,target_recalled,start_prior_grounded,start_prior_explicit_fact_persisted,harness_materialized_correction_target,harness_materialized_investigation_target,target_grounded,artifact_exact_supported,unsupported_exposed_assertions}]}' "/tmp/engine050v3-$TARGET-report.json"
          fi
          exit 0
      - name: Preserve canonical Google evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: engine-0.5-final-v3-${{ matrix.target }}
          path: /tmp/engine050v3-${{ matrix.target }}*
          if-no-files-found: warn

  groq:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - target: groq-qwen3.8-27b
            role: affected_required
          - target: groq-gpt-oss-120b
            role: validated_reference
    env:
      TARGET: ${{ matrix.target }}
      ROLE: ${{ matrix.role }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: engine-0.5-final-v3-freeze
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88.0'
      - uses: Swatinem/rust-cache@v2
      - name: Revalidate surface and build exact product candidate
        run: |
          set -euo pipefail
          git diff --exit-code "$PRODUCT_COMMIT" -- Cargo.toml Cargo.lock crates
          sha256sum -c fixtures/engine-0.5-final-v3-surface.sha256
          python3 scripts/engine_0_5_final_v3_finalization.py --validate-only > /dev/null
          git worktree add --detach /tmp/engine050v3-product "$PRODUCT_COMMIT"
          (cd /tmp/engine050v3-product && CARGO_TARGET_DIR=/tmp/engine050v3-target cargo build --locked -p reasoning-harness-cli --bin reason)
          /tmp/engine050v3-target/debug/reason --version
      - name: Check Groq credential
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: test -n "$GROQ_API_KEY"
      - name: Run first canonical Groq observation
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          REASON_GROQ_MIN_REQUEST_INTERVAL_MS: '2100'
          REASON_GROQ_TOKENS_PER_MINUTE: '8000'
          REASON_GROQ_RATE_LIMIT_TELEMETRY: '1'
        run: |
          set -u
          printf '%s\n' "{\"schema_version\":\"engine-0.5-final-v3-attempt\",\"target\":\"$TARGET\",\"role\":\"$ROLE\",\"github_run_id\":\"$GITHUB_RUN_ID\",\"github_run_attempt\":\"$GITHUB_RUN_ATTEMPT\"}" > "/tmp/engine050v3-$TARGET-attempt.json"
          set +e
          python3 scripts/engine_0_5_final_v3_finalization.py --reason-bin /tmp/engine050v3-target/debug/reason --target "$TARGET" --output "/tmp/engine050v3-$TARGET-report.json" > "/tmp/engine050v3-$TARGET.stdout.json" 2> "/tmp/engine050v3-$TARGET.stderr.log"
          RC=$?
          set -e
          printf '%s\n' "$RC" > "/tmp/engine050v3-$TARGET.rc"
          if test -f "/tmp/engine050v3-$TARGET-report.json"; then
            jq '{provider_target,provider_policy,aggregate,acceptance_passed,cases:[.cases[]|{id,passed,target_recalled,start_prior_grounded,start_prior_explicit_fact_persisted,harness_materialized_correction_target,harness_materialized_investigation_target,target_grounded,artifact_exact_supported,unsupported_exposed_assertions}]}' "/tmp/engine050v3-$TARGET-report.json"
          fi
          exit 0
      - name: Preserve canonical Groq evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: engine-0.5-final-v3-${{ matrix.target }}
          path: /tmp/engine050v3-${{ matrix.target }}*
          if-no-files-found: warn

  final-gate:
    needs: [mistral, google, groq]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: engine-0.5-final-v3-*
          path: /tmp/engine050v3-artifacts
          merge-multiple: true
      - name: Enforce all six independent rows
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          expected = [
              "mistral-14b",
              "groq-qwen3.8-27b",
              "mistral-8b",
              "google-gemini-3.5-flash-lite",
              "google-gemma-4-31b-it",
              "groq-gpt-oss-120b",
          ]
          root = Path("/tmp/engine050v3-artifacts")
          rows = []
          failures = []
          for target in expected:
              report_path = root / f"engine050v3-{target}-report.json"
              rc_path = root / f"engine050v3-{target}.rc"
              row = {
                  "target": target,
                  "report_present": report_path.is_file(),
                  "exit_code": int(rc_path.read_text().strip()) if rc_path.is_file() else None,
                  "acceptance_passed": None,
                  "aggregate": None,
                  "provider_policy": None,
              }
              if report_path.is_file():
                  report = json.loads(report_path.read_text())
                  row["acceptance_passed"] = report.get("acceptance_passed")
                  row["aggregate"] = report.get("aggregate")
                  row["provider_policy"] = report.get("provider_policy")
              aggregate = row["aggregate"] or {}
              passed = (
                  row["exit_code"] == 0
                  and row["acceptance_passed"] is True
                  and aggregate.get("total_cases") == 3
                  and aggregate.get("passed_cases") == 3
                  and aggregate.get("correctness_boundary_violations") == 0
                  and aggregate.get("session_external_calls_replayed") == 0
              )
              row["row_gate_passed"] = passed
              if not passed:
                  failures.append(target)
              rows.append(row)
          matrix = {
              "schema_version": "reason-engine-0.5-final-v3-matrix",
              "github_run_id": os.environ.get("RUN_ID"),
              "all_rows_required_independently": True,
              "no_cross_model_averaging": True,
              "required_targets": expected,
              "required_failures": failures,
              "matrix_acceptance_passed": not failures,
              "rows": rows,
          }
          out = Path("/tmp/engine-0.5-final-v3-matrix.json")
          out.write_text(json.dumps(matrix, indent=2, sort_keys=True) + chr(10))
          print(json.dumps(matrix, indent=2, sort_keys=True))
          if failures:
              raise SystemExit(f"required hardening rows failed: {failures}")
          PY
      - name: Upload aggregate matrix
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: engine-0.5-final-v3-matrix
          path: /tmp/engine-0.5-final-v3-matrix.json
          if-no-files-found: warn
