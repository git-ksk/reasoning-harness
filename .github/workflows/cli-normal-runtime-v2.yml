name: cli-normal-runtime

on:
  workflow_dispatch:
    inputs:
      check_provider_readiness:
        description: Read-only metadata GET after independent exact-runtime PASS
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: cli-normal-runtime-v2
  cancel-in-progress: false

jobs:
  offline-runtime:
    if: inputs.check_provider_readiness != true
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify pinned Git objects and prepare isolated runtime sources
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s evaluation/cli-normal-v2 -p 'test_*.py' -v
          git cat-file -e 6165de77c1544a7fe58fc1e675e7cb3a8ec7cc98^{commit}
          git cat-file -e 73bbd18173b4dfcd6664a26241de0385f2eb2e3e^{commit}
          git cat-file -e 4abee90f0501f0d8fc09b453a0b45c942fbed69e^{commit}
          git cat-file -e ab3c6322921c8c738ec35bd018345917b5afa538^{commit}
          python3 evaluation/cli-normal-v2/prepare_runtime.py --repo . --output target/paired-runtime
          mkdir -p target/paired-build target/paired-context target/paired-controls target/paired-artifact
      - name: Build both patched Engine hosts with identical instrumentation
        run: |
          set -euo pipefail
          stage=target/paired-runtime/repo/evaluation/cli-repair-paired-v1
          docker build -f "$stage/Dockerfile.build" -t paired-builder "$stage"
          docker run --rm --cpus 2 --memory 4g -v "$PWD:/repo:ro" -v "$PWD/target/paired-runtime/repo:/prepared:ro" -v "$PWD/target/paired-build:/work" paired-builder python3 /prepared/evaluation/cli-repair-paired-v1/normal_v2/build.py --repo /repo --work-dir /work/build --fetch-dependencies
          python3 "$stage/assemble_image.py" --repo target/paired-runtime/repo --bin-dir target/paired-build/build/bin --context target/paired-context
          docker build -f "$stage/normal_v2/Dockerfile.runtime" -t paired-runtime target/paired-context
      - name: Verify actual CLI and provider paths without external networking
        run: |
          set -euo pipefail
          docker run --rm --read-only --network none --tmpfs /tmp paired-runtime python3 -B /repo/evaluation/cli-repair-paired-v1/image_inventory.py > target/paired-controls/image-inventory.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          actual=json.loads(Path('target/paired-controls/image-inventory.json').read_bytes())
          prepared=json.loads(Path('target/paired-runtime/preparation.json').read_bytes())
          if not (actual['runtime_files']==prepared['files']): raise ValueError('workflow_integrity_check_failed')
          PY
          docker run --rm --read-only --network none --tmpfs /tmp paired-runtime python3 -B -m unittest discover -s /repo/evaluation/cli-repair-paired-v1 -p 'test_*.py' > target/paired-controls/unit.log 2>&1
          docker run --rm --read-only --network none --tmpfs /tmp paired-runtime python3 -B -m unittest discover -s /repo/evaluation/cli-repair-paired-v1/normal_v2 -p 'test_*.py' > target/paired-controls/ordinary-unit.log 2>&1
          docker run --rm --read-only --network none --tmpfs /tmp -v "$PWD/target/paired-controls:/output" paired-runtime python3 -B /repo/evaluation/cli-repair-paired-v1/preflight.py --bin-dir /eval/bin --output /output/provider
          docker run --rm --read-only --network none --tmpfs /tmp -v "$PWD/target/paired-controls:/output" paired-runtime python3 -B /repo/evaluation/cli-repair-paired-v1/preflight_cli.py --bin-dir /eval/bin --output /output/cli
          docker run --rm --read-only --network none --tmpfs /tmp -v "$PWD/target/paired-controls:/output" paired-runtime python3 -B /repo/evaluation/cli-repair-paired-v1/normal_v2/preflight_normal.py --bin-dir /eval/bin --output /output/ordinary-integration
          docker run --rm --read-only --network none --tmpfs /tmp -v "$PWD/target/paired-controls:/output" paired-runtime python3 -B /repo/evaluation/cli-repair-paired-v1/verify_containment.py --output /output/containment
          docker run --rm -i --read-only --network none --tmpfs /tmp -e PYTHONPATH=/repo/evaluation/cli-repair-paired-v1 -v "$PWD/target/paired-controls:/output" paired-runtime python3 -B - --corpus /output/cli/baseline-google-acquisition/corpus.json --output /output/registry-parity.json < evaluation/cli-repair-paired-v1/verify_registry_parity.py
      - name: Archive exact image and offline identity without granting execution
        run: |
          set -euo pipefail
          # Containers keep private modes; transfer ownership before host proof reads.
          sudo chown -R "$(id -u):$(id -g)" target/paired-controls
          docker save paired-runtime | gzip > target/paired-artifact/runtime-image.tar.gz
          image_id=$(docker image inspect paired-runtime --format '{{.Id}}')
          stage=target/paired-runtime/repo/evaluation/cli-repair-paired-v1
          python3 "$stage/normal_v2/runtime_proof.py" --repo . --prepared target/paired-runtime --bin-dir target/paired-build/build/bin --controls target/paired-controls --image-id "$image_id" --image-archive target/paired-artifact/runtime-image.tar.gz --output target/paired-artifact/runtime-proof.json
          cp target/paired-build/build/bin/identity.json target/paired-artifact/identity.json
          cp target/paired-runtime/preparation.json target/paired-artifact/preparation.json
          sudo tar -czf target/paired-artifact/offline-controls.tar.gz -C target/paired-controls .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: cli-normal-runtime-${{ github.sha }}
          path: |
            target/paired-artifact/
            target/paired-controls/unit.log
            target/paired-controls/ordinary-unit.log
          if-no-files-found: error
          retention-days: 14

  provider-metadata-readiness:
    if: inputs.check_provider_readiness == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        provider: [mistral]
    concurrency:
      group: reasoning-harness-mistral-live
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Load independently reviewed runtime before credentials
        env:
          GH_TOKEN: ${{ github.token }}
          EVALUATION_PROVIDER: ${{ matrix.provider }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/readiness /tmp/runtime /tmp/review
          python3 - <<'PY'
          import hashlib,json,os,shutil,subprocess
          from pathlib import Path
          source=Path('evaluation/cli-normal-real24-development-v2')
          reference=json.loads((source/'runtime-reference.json').read_bytes())
          review=source/'development-review/review.json'
          if not (hashlib.sha256(review.read_bytes()).hexdigest()==reference['operational_review_sha256']): raise ValueError('workflow_integrity_check_failed')
          shutil.copyfile(review,'/tmp/review/review.json')
          with open('/tmp/runtime.zip','wb') as stream:
              subprocess.run(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/artifacts/{reference["runtime_artifact_id"]}/zip'],stdout=stream,check=True)
          PY
          # Trust checkout-side review and actual archive bytes before any downloaded code.
          python3 evaluation/cli-normal-v2/verify_runtime_archive.py --artifact-zip /tmp/runtime.zip --output /tmp/runtime --review evaluation/cli-normal-real24-development-v2/development-review/review.json --reference evaluation/cli-normal-real24-development-v2/runtime-reference.json
          artifact_root=/tmp/runtime
          docker load -i "$artifact_root/runtime-image.tar.gz"
          cp "$artifact_root/runtime-proof.json" /tmp/review/runtime-proof.json
          image_id=$(docker image inspect paired-runtime --format '{{.Id}}')
          python3 evaluation/cli-normal-v2/verify_runtime_archive.py --loaded-proof "$artifact_root/runtime-proof.json" --actual-image-id "$image_id" --review evaluation/cli-normal-real24-development-v2/development-review/review.json --reference evaluation/cli-normal-real24-development-v2/runtime-reference.json
          PAIRED_RUNTIME_IMAGE="$image_id"
          echo "PAIRED_RUNTIME_IMAGE=$image_id" >> "$GITHUB_ENV"
          docker run --pull=never --rm --read-only --network none --tmpfs /tmp -v /tmp/review:/review:ro -v "$artifact_root:/image:ro" "$PAIRED_RUNTIME_IMAGE" python3 -B /repo/evaluation/cli-repair-paired-v1/normal_v2/provider_readiness.py --provider "$EVALUATION_PROVIDER" --review /review/review.json --runtime-proof /review/runtime-proof.json --image-archive /image/runtime-image.tar.gz --actual-image-id "$image_id" --verify-only
      - name: Single metadata GET with no generation or retry
        env:
          MISTRAL_API_KEY: ${{ matrix.provider == 'mistral' && secrets.MISTRAL_API_KEY || '' }}
          EVALUATION_PROVIDER: ${{ matrix.provider }}
        run: |
          set -euo pipefail
          name=cli-normal-metadata-$EVALUATION_PROVIDER-$GITHUB_RUN_ID
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT INT TERM
          timeout --signal=INT --kill-after=5s 60s docker run --pull=never --name "$name" --rm --read-only --tmpfs /tmp -v /tmp/review:/review:ro -v /tmp/readiness:/output -e MISTRAL_API_KEY "$PAIRED_RUNTIME_IMAGE" python3 -B /repo/evaluation/cli-repair-paired-v1/normal_v2/provider_readiness.py --provider "$EVALUATION_PROVIDER" --review /review/review.json --runtime-proof /review/runtime-proof.json --output /output/readiness.json
      - name: Stop metadata container before collection
        if: always()
        run: docker rm -f cli-normal-metadata-${{ matrix.provider }}-${{ github.run_id }} >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: cli-normal-readiness-${{ matrix.provider }}-${{ github.run_id }}
          path: /tmp/readiness/
          if-no-files-found: error
          retention-days: 14
