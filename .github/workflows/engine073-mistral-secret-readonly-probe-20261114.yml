name: engine073-mistral-secret-readonly-probe

# One-time push on a dedicated branch. No inference and no billing endpoint.
on:
  push:
    branches: [eval/engine073-mistral-secret-probe-20261114]

permissions:
  contents: read

concurrency:
  group: engine073-mistral-secret-readonly-probe
  cancel-in-progress: false

jobs:
  credential-readonly:
    name: Verify secret and model catalog without generation
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: GET model catalog with GitHub secret (no inference)
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          key = os.environ.get("MISTRAL_API_KEY", "")
          if not key:
              print("credential_status=missing")
              sys.exit(2)
          req = urllib.request.Request(
              "https://api.mistral.ai/v1/models",
              method="GET",
              headers={"Authorization": "Bearer " + key, "Accept": "application/json"},
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as response:
                  status = response.status
                  content = response.read(2_000_000)
          except urllib.error.HTTPError as exc:
              print("credential_status=http_" + str(exc.code))
              sys.exit(3)
          except Exception:
              print("credential_status=transport_error")
              sys.exit(4)

          if status != 200:
              print("credential_status=unexpected_http_status")
              sys.exit(5)
          try:
              payload = json.loads(content)
              models = {
                  str(item.get("id", ""))
                  for item in payload.get("data", [])
                  if isinstance(item, dict)
              }
          except (ValueError, TypeError, AttributeError):
              print("credential_status=unparseable_catalog")
              sys.exit(6)
          print("credential_status=accepted")
          print("requested_model_in_catalog=" +
                str("ministral-8b-2512" in models).lower())
          print("model_api_calls=0")
          print("completions_created=0")
          print("billing_or_free_quota_verified=false")
          print("quality_go=false")
          PY
