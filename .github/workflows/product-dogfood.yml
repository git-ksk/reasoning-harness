name: product-dogfood

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider for the same-model raw vs Harness vs Harness+D3+sufficiency comparison
        required: true
        type: choice
        options:
          - mistral
          - google
          - nvidia
        default: mistral
      model:
        description: Provider model identifier
        required: true
        type: string
        default: ministral-8b-latest
      fixture_set:
        description: Product dogfood corpus
        required: true
        type: choice
        options:
          - product-dogfood-v2
          - product-dogfood-holdout-v1
          - product-dogfood-v1
        default: product-dogfood-v2
      max_tokens:
        description: Maximum output tokens per model call
        required: true
        type: choice
        options:
          - '512'
          - '1024'
          - '2048'
        default: '1024'
      seed:
        description: Base random seed
        required: true
        type: string
        default: '12000'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Validate selected fixture corpus
        env:
          FIXTURE_SET: ${{ inputs.fixture_set }}
        run: |
          set -euo pipefail
          cargo run -q --locked -p reasoning-harness-cli --bin reason-product-dogfood -- \
            --fixtures "fixtures/$FIXTURE_SET" \
            --provider mistral \
            --model validation-only \
            --validate-only \
            > /tmp/reason-product-dogfood-validation.json
          case "$FIXTURE_SET" in
            product-dogfood-v2)
              (cd fixtures/product-dogfood-v2 && sha256sum -c ../product-dogfood-v2.sha256)
              jq -e '
                .cases == 24
                and (.capability_families | length) == 8
                and ([.capability_case_counts[]] | all(. == 3))
              ' /tmp/reason-product-dogfood-validation.json >/dev/null
              ;;
            product-dogfood-holdout-v1)
              (cd fixtures/product-dogfood-holdout-v1 && sha256sum -c ../product-dogfood-holdout-v1.sha256)
              jq -e '
                .cases == 16
                and (.capability_families | length) == 8
                and ([.capability_case_counts[]] | all(. == 2))
              ' /tmp/reason-product-dogfood-validation.json >/dev/null
              ;;
            product-dogfood-v1)
              jq -e '.cases == 6' /tmp/reason-product-dogfood-validation.json >/dev/null
              ;;
            *) exit 2 ;;
          esac
      - name: Check selected provider credential
        env:
          PROVIDER: ${{ inputs.provider }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -euo pipefail
          case "$PROVIDER" in
            mistral) test -n "$MISTRAL_API_KEY" ;;
            google) test -n "$GEMINI_API_KEY" ;;
            nvidia) test -n "$NVIDIA_API_KEY" ;;
            *) exit 2 ;;
          esac
      - name: Run same-model product dogfood
        env:
          PROVIDER: ${{ inputs.provider }}
          MODEL: ${{ inputs.model }}
          MAX_TOKENS: ${{ inputs.max_tokens }}
          SEED: ${{ inputs.seed }}
          FIXTURE_SET: ${{ inputs.fixture_set }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          REASON_MISTRAL_RATE_LIMIT_TELEMETRY: '1'
        run: |
          set -euo pipefail
          cargo run -q --locked -p reasoning-harness-cli --bin reason-product-dogfood -- \
            --fixtures "fixtures/$FIXTURE_SET" \
            --provider "$PROVIDER" \
            --model "$MODEL" \
            --max-tokens "$MAX_TOKENS" \
            --seed "$SEED" \
            --checkpoint /tmp/reason-product-dogfood.checkpoint.json \
            --output /tmp/reason-product-dogfood.json \
            > /tmp/reason-product-dogfood.stdout.json
          jq -e '
            .schema_version == "reason-product-dogfood-v10"
            and .comparison_contract == "shared-candidate-initial-render-v1"
            and .execution.checkpoint_enabled == true
            and .execution.resume_requested == false
            and .execution.reused_completed_cases == 0
            and .execution.newly_executed_cases == .cases
            and ([.results[].raw.exposed_text] | all(type == "string"))
            and ([.results[].harness | ((.finalization_status == "grounded_answer" or .finalization_status == "qualified_partial_answer") == has("exposed_text"))] | all)
            and ([.results[].harness_current_safety | ((.finalization_status == "grounded_answer" or .finalization_status == "qualified_partial_answer") == has("exposed_text"))] | all)
            and .cases >= 6
            and (.workload_classes | length) >= 2
            and (if env.FIXTURE_SET == "product-dogfood-v2" then
              .cases == 24
              and (.capability_families | length) == 8
              and ([.capability_case_counts[]] | all(. == 3))
            elif env.FIXTURE_SET == "product-dogfood-holdout-v1" then
              .cases == 16
              and (.capability_families | length) == 8
              and ([.capability_case_counts[]] | all(. == 2))
            else .cases == 6 end)
            and .harness.arm.unsupported_grounded_claims == 0
            and .harness_current_safety.arm.unsupported_grounded_claims == 0
            and .harness.failure_provenance.classified_misses == .harness.failure_provenance.missed_grounded_targets
            and .harness_current_safety.failure_provenance.classified_misses == .harness_current_safety.failure_provenance.missed_grounded_targets
            and ((.harness.failure_provenance.miss_classes.other // 0) == 0)
            and ((.harness_current_safety.failure_provenance.miss_classes.other // 0) == 0)
            and .raw.target.expected_unknown_cases == .raw.expected_unknown_cases
            and .harness.arm.target.expected_unknown_cases == .harness.arm.expected_unknown_cases
            and .harness_current_safety.arm.target.expected_unknown_cases == .harness_current_safety.arm.expected_unknown_cases
            and .raw.target.expected_grounded_cases == .raw.expected_grounded_cases
            and .harness.arm.target.expected_grounded_cases == .harness.arm.expected_grounded_cases
            and .harness_current_safety.arm.target.expected_grounded_cases == .harness_current_safety.arm.expected_grounded_cases
            and ([.results[] | (.harness.calls[0] == .shared_harness.candidate_call)] | all)
            and ([.results[] | (.harness_current_safety.calls[0] == .shared_harness.candidate_call)] | all)
            and ([.results[] | (.harness.calls[1] == .shared_harness.initial_render_call)] | all)
            and ([.results[] | (.harness_current_safety.calls[1] == .shared_harness.initial_render_call)] | all)
            and ([.results[].harness.safety_runtime.configuration_id] | all(. == "grounded-finalization-v1"))
            and ([.results[].harness_current_safety.safety_runtime.configuration_id] | all(. == "verified-target-answer-gate-v1"))
            and (if env.FIXTURE_SET == "product-dogfood-holdout-v1" then
              .harness_current_safety.arm.unsupported_grounded_claims == 0
              and .harness_current_safety.arm.target.missed_target_insufficiency == 0
              and .harness_current_safety.arm.target.mean_grounded_target_coverage >= 0.90
            else true end)
          ' /tmp/reason-product-dogfood.json >/dev/null
          jq '{schema_version, comparison_contract, provider, model, workload_classes, capability_families, capability_case_counts, cases, raw, harness, harness_current_safety, overhead, execution, user_comprehension}' /tmp/reason-product-dogfood.json
      - name: Preserve dogfood report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: product-dogfood-${{ inputs.fixture_set }}-${{ inputs.provider }}-${{ inputs.model }}
          path: |
            /tmp/reason-product-dogfood.json
            /tmp/reason-product-dogfood.checkpoint.json
          if-no-files-found: error
          retention-days: 30
