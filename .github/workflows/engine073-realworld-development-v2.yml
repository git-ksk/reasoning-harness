name: engine073-realworld-development-v2
on:
  push:
    tags:
      - 'engine073-realworld-v2-development-v1'
permissions:
  contents: read
  actions: read
jobs:
  development:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        provider: [mistral, google]
    concurrency:
      group: ${{ matrix.provider == 'mistral' && 'reasoning-harness-mistral-live' || 'engine07-realworld-google-live' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check separate development admission before provider credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/results /tmp/runtime /tmp/frozen
          test "$GITHUB_RUN_ATTEMPT" = 1
          gh api 'repos/${{ github.repository }}/actions/runs?event=push&head_sha=${{ github.sha }}&per_page=100' > /tmp/results/run-reservation.json
          python3 - <<'PYREADY'
          import json,os
          from pathlib import Path
          runs=json.load(open('/tmp/results/run-reservation.json'))['workflow_runs']
          matches=[r for r in runs if r['path']=='.github/workflows/engine073-realworld-development-v2.yml']
          assert len(matches)==1 and str(matches[0]['id'])==os.environ['GITHUB_RUN_ID']
          p=Path('evaluation/engine073-realworld-v2-development-freeze-v1/receipt.json');receipt=json.loads(p.read_bytes())
          assert receipt['state']=='DEVELOPMENT_FROZEN' and receipt['accuracy_acceptance'] is False and receipt['fresh_accuracy_cases']==0
          assert receipt['required_provider_readiness']['${{ matrix.provider }}']['new_live_run_allowed'] is True
          PYREADY
          artifact=$(python3 -c "import json;print(json.load(open('evaluation/engine073-realworld-v2-development-freeze-v1/receipt.json'))['runtime_artifact_id'])")
          gh api "repos/${{ github.repository }}/actions/artifacts/$artifact/zip" > /tmp/runtime.zip
          unzip -q /tmp/runtime.zip -d /tmp/runtime
          docker load -i /tmp/runtime/runtime-image.tar.gz
          image_id=$(docker image inspect engine073-runtime-v2 --format '{{.Id}}')
          cp evaluation/engine073-realworld-v2-development-freeze-v1/receipt.json /tmp/frozen/development.json
          cp -R evaluation/engine073-realworld-v2-development-freeze-v1/development-review /tmp/frozen/development-review
          cp -R evaluation/engine073-realworld-independent-v1-input /tmp/frozen/corpus
          docker run --rm --read-only --network none --tmpfs /tmp -v /tmp/frozen:/frozen:ro -v /tmp/runtime:/image:ro engine073-runtime-v2 python3 -B /repo/evaluation/engine073-realworld-evaluator-v2/verify_development.py --receipt /frozen/development.json --provider '${{ matrix.provider }}' --image-archive /image/runtime-image.tar.gz --actual-image-id "$image_id"
          python3 -B evaluation/engine073-realworld-evaluator-v1/prepare_sources.py --corpus-dir /tmp/frozen/corpus --M1-sha256 597e1488d07654b07e2a1e528db8b1ae934e438a8edd3f96d31cfc26dd584cd3
          sudo chmod -R a-w /tmp/frozen
          docker run --rm --read-only --network none --tmpfs /tmp -v /tmp/frozen:/frozen:ro -v /tmp/results:/output engine073-runtime-v2 python3 -B /repo/evaluation/engine073-realworld-evaluator-v2/make_development_plan.py --receipt /frozen/development.json --corpus-dir /frozen/corpus --provider '${{ matrix.provider }}' --output /output/plan.json
      - name: One seen24 diagnostic lane with bounded external containment
        env:
          MISTRAL_API_KEY: ${{ matrix.provider == 'mistral' && secrets.MISTRAL_API_KEY || '' }}
          GEMINI_API_KEY: ${{ matrix.provider == 'google' && secrets.GEMINI_API_KEY || '' }}
        run: |
          set -euo pipefail
          name=engine073-v2-development-${{ matrix.provider }}-${{ github.run_id }}
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT INT TERM
          timeout --signal=INT --kill-after=5s 340m docker run --name "$name" --read-only --tmpfs /tmp -v /tmp/frozen:/frozen:ro -v /tmp/results:/output -e MISTRAL_API_KEY -e GEMINI_API_KEY engine073-runtime-v2 python3 -B /repo/evaluation/engine073-realworld-evaluator-v2/run_lane.py --plan /output/plan.json --output /output/lane --protocol /repo/evaluation/engine073-realworld-evaluator-v2/protocol.json
      - name: Stop contained processes before collection
        if: always()
        run: docker rm -f engine073-v2-development-${{ matrix.provider }}-${{ github.run_id }} >/dev/null 2>&1 || true
      - name: Collect with the owning container UID; missing plan is a failure
        if: always()
        run: |
          set -euo pipefail
          docker run --rm --read-only --network none --tmpfs /tmp -v /tmp/frozen:/frozen:ro -v /tmp/results:/output engine073-runtime-v2 python3 -B /repo/evaluation/engine073-realworld-evaluator-v2/collect_checked.py --corpus-dir /frozen/corpus --provider '${{ matrix.provider }}' --lane /output/lane --output /output/observations
      - name: Transfer captured ownership to uploader without changing private modes
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" /tmp/results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: engine073-realworld-v2-development-${{ matrix.provider }}-${{ github.run_id }}
          path: /tmp/results/
          if-no-files-found: error
          retention-days: 30
