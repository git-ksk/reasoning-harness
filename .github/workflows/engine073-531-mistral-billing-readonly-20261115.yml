name: Mistral no-PAYG bounded entitlement probe
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reasoning-harness-mistral-live
  cancel-in-progress: false
jobs:
  entitlement-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify account and execute at most one synthetic eight-output-token probe
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python3 evaluation/owner-paired-v4/free_tier_probe.py
