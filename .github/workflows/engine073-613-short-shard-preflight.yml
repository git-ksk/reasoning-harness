name: engine073-613-short-shard-preflight

# Eight genuinely independent *offline* jobs, one per frozen 3-case shard.
# This workflow has NO secrets, NO provider requests, NO live tag trigger,
# NO retries, and NO continuation of the cancelled 43667947455 run.
# A separately reviewed, uniquely named one-shot live workflow is required
# before *any* future billed or free-tier model inference.
on:
  pull_request:
    paths:
      - .github/workflows/engine073-613-short-shard-preflight.yml
      - evaluation/dev-lite/issue531_real24_live.py
      - evaluation/dev-lite/issue613_short_shard_preflight.py
      - evaluation/dev-lite/test_issue531_real24_live.py
      - evaluation/dev-lite/test_issue613_short_shard_preflight.py
      - evaluation/engine073-531-real-doc24-20261115/**
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  offline-shard:
    name: pinned-public-preflight-${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate frozen source and bounded 3-case partition without provider
        shell: bash
        run: |
          set -euo pipefail
          # No inherited credential, no model adapter, no private corpus.
          env -u MISTRAL_API_KEY -u REASON_DEV_LITE_FREE_CONFIRMED PYTHONDONTWRITEBYTECODE=1 \
            python3 evaluation/dev-lite/issue613_short_shard_preflight.py \
              --repo . --shard '${{ matrix.shard }}'
